<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "chrome": {"editor": "boolean", "default": true}, "$preview": {"width": 1376, "height": 1032}}'>

  segOn:'#FFFFFF', segShadow:'0 1px 2px rgba(0,0,0,0.18)', checkboxStroke:'rgba(0,0,0,0.25)',
  card:'rgba(0,0,0,0.035)', box:'#FFFFFF', boxStroke:'rgba(0,0,0,0.06)' };
const DARK = { content:'#1C1C1E', label:'rgba(255,255,255,0.90)', label2:'rgba(255,255,255,0.58)', label3:'rgba(255,255,255,0.28)',
  sep:'rgba(255,255,255,0.10)', fill:'rgba(255,255,255,0.07)', fill2:'#2C2C2E', pressed:'rgba(255,255,255,0.12)', track:'rgba(255,255,255,0.14)',

// Chart style C: single series = one amber hue (ordinary 38% light / 45% dark, the mark that matters full accent);
// s1-s6 = validated categorical palette for multi-series charts and donuts (fixed order).
const CHART_LIGHT = { top:'#C6730E', soft:'rgba(198,115,14,0.38)', area:'rgba(198,115,14,0.10)', grid:'rgba(0,0,0,0.08)',
  s1:'#C6730E', s2:'#3D6FB6', s3:'#1E9180', s4:'#9A4FA0', s5:'#6F8A1E', s6:'#B83E8C' };
const CHART_DARK = { top:'#EB9526', soft:'rgba(235,149,38,0.45)', area:'rgba(235,149,38,0.14)', grid:'rgba(255,255,255,0.10)',
  s1:'#CF7F18', s2:'#5C88E0', s3:'#1F9C84', s4:'#B070C8', s5:'#7C962A', s6:'#D35E98' };

// Settings icon tiles (FS-08.01b §2): one system colour per pane, 14% light / 24% dark, never amber.
function tileTints(dark) {
  const C = { blue:['#007AFF','#0040DD','#0A84FF','#409CFF'], indigo:['#5856D6','#3634A3','#5E5CE6','#7D7AFF'],
    pink:['#FF2D55','#D30F45','#FF375F','#FF6482'], teal:['#30B0C7','#008299','#40C8E0','#5DE6FF'],
    brown:['#A2845E','#7F6545','#AC8E68','#B59469'], green:['#34C759','#248A3D','#30D158','#30DB5B'],
    mint:['#00C7BE','#0C817B','#63E6E2','#66D4CF'], red:['#FF3B30','#D70015','#FF453A','#FF6961'],
    gray:['#8E8E93','#6C6C70','#98989F','#AEAEB2'], purple:['#AF52DE','#8944AB','#BF5AF2','#DA8FFF'], orange:['#FF9500','#C93400','#FF9F0A','#FFB340'] };
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
  const out = {};
  Object.keys(C).forEach((k) => { const c = C[k];
    out[k + 'Bg'] = dark ? rgba(c[2], 0.24) : rgba(c[0], 0.14);
    out[k + 'Fg'] = dark ? c[3] : c[1]; });
  return out;
}

// Movie player chrome is always dark (FS-23.02, tier C), the same set as the iPhone boards.
const PLAYER = {"glass": "rgba(30,30,32,0.72)", "glassStroke": "rgba(255,255,255,0.12)", "label": "#FFFFFF", "label2": "rgba(255,255,255,0.62)", "label3": "rgba(255,255,255,0.38)", "track": "rgba(255,255,255,0.22)", "fill": "rgba(255,255,255,0.14)", "sel": "rgba(255,255,255,0.20)", "panel": "rgba(28,28,30,0.94)", "sep": "rgba(255,255,255,0.12)", "accent": "#EB9526", "onAccent": "#000000", "sub1": "#FFFFFF", "sub2": "#FFD60A", "green": "#30D158"};
class Component extends DCLogic {
  renderVals() {
    const P = this.props; const dark = !!P.dark;
    const t = dark ? DARK : LIGHT;
    const base = { t, edge: dark ? 'rgba(28,28,30,0.85)' : 'rgba(255,255,255,0.85)', edgeClear: dark ? 'rgba(28,28,30,0)' : 'rgba(255,255,255,0)', tt: tileTints(dark) };
    const on = P.chrome !== false; const E = { chromeOn: on ? 'block' : 'none' };
    return Object.assign(base, { p: PLAYER }, E);
  }
}
