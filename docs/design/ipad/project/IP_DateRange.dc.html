</div>

// Rating / flag / favorite per photo (FS-01.12 §7). Deterministic from the tile seed; o.marks overrides by index.
const RATES=[0,0,3,0,0,4,0,2,0,0,5,0,1,0,3,0,0];
function markFor(k, isVideo){
  return { r: RATES[k%RATES.length], f: isVideo?'':((k%7)===3?'p':((k%11)===8?'x':'')), fav: (k%9)===5 };

// o.sel = ring indices; o.selecting = Select mode (check circles); o.live marks Live Photos (iPad has them, the Mac grid does not draw them)
function tiles(n, seed, o){
  o=o||{}; const out=[];
  for(let i=0;i<n;i++){
    const k=i+seed; const isVideo=!o.noVideo && (k%11)===4;
    const pending=(o.pendingFrom!=null && i>=o.pendingFrom); const off=!!o.offline;
    const meta=o.meta?o.meta[k%o.meta.length]:META[k%META.length];
    const mk=(o.marks && o.marks[i])?o.marks[i]:markFor(k,isVideo);
    const ft=isVideo?'MOV':(o.ft?o.ft[k%o.ft.length]:FT[k%FT.length]);
    const live=!isVideo && ft==='HEIC' && (k%3)===0;
    const sel=(o.sel||[]).indexOf(i)>=0; const selecting=!!o.selecting;
    const words=[]; if(mk.r) words.push(mk.r+(mk.r===1?' star':' stars')); if(mk.f==='p') words.push('Picked'); if(mk.f==='x') words.push('Rejected'); if(mk.fav) words.push('Favorite'); if(live) words.push('Live Photo');
    out.push({ bg: tile(k*5+3), ft, isVideo, dur: DUR[k%DUR.length],
      meta: isVideo?'4K · 24 fps':meta, sel, checked: selecting&&sel, unchecked: selecting&&!sel, metaRight: selecting?'36px':'6px', offline: off,
      op: mk.f==='x'?'0.45':'1', pick: mk.f==='p', rej: mk.f==='x', fav: !!mk.fav, rated: mk.r>0, stars: String(mk.r), live,
      loaded: !pending, pending,

}

function menu(t, arr, keys){

    return {item:true, l:x[0], k, kp:k?'10px':'0', sub:f.indexOf('s')>=0, check:f.indexOf('c')>=0?'✓':'', dis:dis?'true':'false',
      bg:hi?t.accentFill:'transparent', fg:hi?t.onAccentFill:(dis?t.label3:(red?t.redText:t.label)), kc:hi?t.onAccentFill:(dis?t.label3:t.label2)};

// One month: Sunday-first grid; range Aug 23 – Sep 12, 2026; days after today (Sun Oct 4) cannot be picked.
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function month(t, y, m, first, len){
  const days=[]; const key=(mm,dd)=>mm*100+dd; const A=key(7,23), B=key(8,12), TODAY=key(9,4);
  for(let i=0;i<first;i++) days.push({n:'',aria:'',dis:true,bg:'transparent',fg:t.label,fw:'400',band:'transparent',bl:'0',br:'0'});
  for(let d=1; d<=len; d++){
    const k=key(m,d); const inR=k>=A&&k<=B; const end=(k===A||k===B); const fut=k>TODAY; const dow=(first+d-1)%7;
    days.push({n:String(d), aria:MONTHS[m]+' '+d+(end?(k===A?', range start':', range end'):(inR?', in range':''))+(k===TODAY?', today':''), dis:fut,
      bg:end?t.accentFill:'transparent', fg:end?t.onAccentFill:(fut?t.label3:(k===TODAY?t.accentText:t.label)), fw:(end||k===TODAY)?'600':'400',
      band:inR?t.accentSoft:'transparent', bl:(k===A||dow===0||d===1)?'50%':'0', br:(k===B||dow===6||d===len)?'50%':'0'});
  }

}
