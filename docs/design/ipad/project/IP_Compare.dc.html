<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPad · Viewer · 2-Up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font-family:inherit;padding:0;margin:0;cursor:default}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 1376px; height: 1032px; position: relative; overflow: hidden; border-radius: 18px; background: {{t.content}}; color: {{t.label}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px">
<!-- 2-UP: the Viewer in Compare mode (not tier D: follows light/dark like the Viewer). Select left, Candidate right;
     zoom and pan move together; each pane carries its own caption with name, EXIF, rating and None/Pick/Reject.
     Reject marks a photo for deletion; Delete N in the toolbar removes the rejected ones. Inspector hidden. -->
<sc-for list="{{panes}}" as="p" hint-placeholder-count="2">
<section aria-label="{{p.label}}" style="position:absolute;left:{{p.x}};top:84px;width:664px;height:832px"><div role="img" aria-label="{{p.imgLabel}}" style="position:absolute;left:0;top:0;width:664px;height:768px;border-radius:10px;overflow:hidden;background:{{t.fill2}}"><div style="position:absolute;left:{{p.ox}};top:{{p.oy}};width:2400px;height:1600px"><div style="position:absolute;inset:0;background:{{p.sky}}"></div><div style="position:absolute;left:66.3%;top:33.8%;width:127px;height:127px;margin-left:-2.65%;border-radius:50%;background:#FBE3B8;opacity:0.9"></div><div style="position:absolute;inset:0;background:#4D4A5A;clip-path:polygon(0% 62%,12% 52%,24% 58%,38% 44%,50% 54%,63% 47%,78% 57%,90% 50%,100% 56%,100% 100%,0% 100%)"></div><div style="position:absolute;inset:0;background:#2F3A36;clip-path:polygon(0% 72%,16% 66%,30% 73%,47% 63%,62% 71%,80% 64%,100% 70%,100% 100%,0% 100%)"></div><div style="position:absolute;inset:0;background:#1C2420;clip-path:polygon(0% 84%,20% 80%,42% 86%,64% 79%,84% 84%,100% 80%,100% 100%,0% 100%)"></div></div><span style="position:absolute;left:12px;top:12px;height:26px;padding:0 10px;border-radius:13px;background:{{p.roleBg}};color:{{p.roleFg}};font-size:13px;font-weight:600;line-height:26px">{{p.role}}</span><sc-if value="{{p.picked}}" hint-placeholder-val="{{false}}"><span style="position:absolute;right:12px;top:12px;height:26px;padding:0 10px 0 8px;border-radius:13px;background:rgba(0,0,0,0.58);color:#FFFFFF;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><path d="M6 3v18 M6 4h12l-3 4.5 3 4.5H6z"></path></svg>Picked</span></sc-if><sc-if value="{{p.rejected}}" hint-placeholder-val="{{false}}"><span style="position:absolute;right:12px;top:12px;height:26px;padding:0 10px 0 8px;border-radius:13px;background:{{t.redFill}};color:#FFFFFF;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12 M18 6L6 18"></path></svg>Rejected</span></sc-if><span style="position:absolute;left:12px;bottom:12px;height:26px;padding:0 10px;border-radius:13px;background:rgba(0,0,0,0.58);color:#FFFFFF;font-size:13px;font-weight:600;line-height:26px;font-variant-numeric:tabular-nums">100%</span></div><sc-if value="{{p.focus}}" hint-placeholder-val="{{true}}"><div aria-hidden="true" style="position:absolute;left:-4px;top:-4px;width:672px;height:776px;border:2px solid {{t.accent}};border-radius:13px;box-sizing:border-box"></div></sc-if><div style="position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 2px;box-sizing:border-box"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:600;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{p.name}}</span><span style="font-size:13px;line-height:16px;color:{{t.label2}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums">{{p.exif}}</span></div><div role="radiogroup" aria-label="{{p.rateLabel}}" style="display:flex;align-items:center;flex:none"><sc-for list="{{p.stars}}" as="s" hint-placeholder-count="5"><button role="radio" aria-checked="{{s.on}}" aria-label="{{s.label}}" style="width:32px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.9l-5.25 2.7 1-5.8L3.5 9.7l5.9-.9z"></path></svg></button></sc-for></div><div role="radiogroup" aria-label="{{p.flagLabel}}" style="height:36px;border-radius:10px;background:{{t.fill}};padding:2px;box-sizing:border-box;display:flex;gap:2px;flex:none"><sc-for list="{{p.flags}}" as="f" hint-placeholder-count="3"><button role="radio" aria-checked="{{f.on}}" style="height:32px;padding:0 12px;border-radius:8px;border:none;background:{{f.bg}};box-shadow:{{f.shadow}};color:{{f.fg}};font-size:15px;font-weight:{{f.fw}};white-space:nowrap">{{f.name}}</button></sc-for></div></div></section>
</sc-for>
<!-- FILMSTRIP (full width, inspector hidden): the compared photos carry the amber ring, the focused one adds the inner gap; rejected ones dim -->
<div aria-label="Filmstrip" style="position:absolute;left:0;width:1376px;top:932px;bottom:0;border-top:1px solid {{t.sep}};box-sizing:border-box">
<div style="position:absolute;left:0;right:0;top:13px;display:flex;justify-content:center;gap:6px">
<sc-for list="{{strip}}" as="f" hint-placeholder-count="12">
<div aria-label="{{f.label}}" style="position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;flex:none"><div style="position:absolute;inset:0;background:{{f.bg}};opacity:{{f.op}}"></div><div style="position:absolute;inset:0;border-radius:6px;box-shadow:{{f.ring}}"></div></div>
</sc-for>
</div>
<div style="position:absolute;right:24px;top:13px;height:64px;display:flex;align-items:center;font-size:13px;color:{{t.label2}};white-space:nowrap;font-variant-numeric:tabular-nums">{{stripNote}}</div>
</div>
<!-- TOOLBAR (Viewer in 2-Up, sidebar hidden): [Show Sidebar | Back] title · [Single · 2-Up · Survey] · [Zoom | Sync · Make Select · Share | Inspector] · Delete 1 Photo (bordered, red text) · Edit -->
<div style="position:absolute;left:16px;right:16px;top:24px;height:44px;display:flex;align-items:center;gap:12px">
<div style="height:44px;border-radius:22px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);display:flex;align-items:center;padding:0 2px;box-sizing:border-box;flex:none;color:{{t.label}}"><button aria-label="Show Sidebar" style="width:44px;height:40px;border-radius:20px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z M9 5v14"></path></svg></button><span aria-hidden="true" style="width:1px;height:22px;background:{{t.sep}};margin:0 4px;flex:none"></span><button aria-label="Back" style="width:44px;height:40px;border-radius:20px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button></div>
<div style="display:flex;flex-direction:column;gap:1px;min-width:0;flex:none"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px;font-weight:600;line-height:24px;white-space:nowrap">{{title}}</span></div><div style="font-size:13px;color:{{t.label2}};line-height:16px;white-space:nowrap;font-variant-numeric:tabular-nums">{{subtitle}}</div></div>
<div style="flex:1"></div>
<div role="radiogroup" aria-label="Viewer Mode" style="height:44px;border-radius:22px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);display:flex;align-items:center;padding:0 2px;box-sizing:border-box;flex:none;color:{{t.label}}"><button role="radio" aria-checked="false" style="height:40px;padding:0 18px;border-radius:20px;border:none;background:none;color:{{t.label2}};font-size:17px;font-weight:500">Single</button><button role="radio" aria-checked="true" style="height:40px;padding:0 18px;border-radius:20px;border:none;background:{{t.pressed}};color:{{t.label}};font-size:17px;font-weight:600">2-Up</button><button role="radio" aria-checked="false" style="height:40px;padding:0 18px;border-radius:20px;border:none;background:none;color:{{t.label2}};font-size:17px;font-weight:500">Survey</button></div>
<div style="height:44px;border-radius:22px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);display:flex;align-items:center;padding:0 2px;box-sizing:border-box;flex:none;color:{{t.label}}"><button aria-label="Zoom" style="height:40px;padding:0 8px 0 14px;border:none;background:none;color:{{t.label}};font-size:17px;display:flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums">100%<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.label2}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5-5 5 5 M7 15l5 5 5-5"></path></svg></button><span aria-hidden="true" style="width:1px;height:22px;background:{{t.sep}};margin:0 4px;flex:none"></span><button aria-label="Sync Zoom and Pan" aria-pressed="true" style="width:44px;height:40px;border-radius:20px;border:none;background:{{t.pressed}};display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></button><button aria-label="Make Select" style="width:44px;height:40px;border-radius:20px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12 M16 4l3 3-3 3 M17 17H5 M8 14l-3 3 3 3"></path></svg></button><button aria-label="Share" style="width:44px;height:40px;border-radius:20px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12 M8 7l4-4 4 4 M5 12v8h14v-8"></path></svg></button><span aria-hidden="true" style="width:1px;height:22px;background:{{t.sep}};margin:0 4px;flex:none"></span><button aria-label="Show Inspector" aria-pressed="false" style="width:44px;height:40px;border-radius:20px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z M15 5v14"></path></svg></button></div>
<button style="height:44px;border-radius:22px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);color:{{t.redText}};display:flex;align-items:center;gap:8px;padding:0 18px;font-size:17px;font-weight:600;flex:none;white-space:nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13 M10 11v6 M14 11v6"></path></svg>{{deleteLabel}}</button>
<button style="height:44px;border-radius:22px;border:none;background:{{t.accentFill}};color:{{t.onAccentFill}};display:flex;align-items:center;gap:8px;padding:0 20px;font-size:17px;font-weight:600;flex:none;white-space:nowrap;box-shadow:{{t.glassShadow}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10 M18 7h2 M4 17h4 M12 17h8 M16 4v6 M10 14v6"></path></svg>Edit</button>
</div>
<!-- Long-press menu on the Candidate (opaque, rows 44, no shortcut column). Keep Only This rejects every other photo in the comparison -->
<div role="menu" aria-label="Candidate Actions" style="position:absolute;left:964px;top:300px;width:300px;padding:6px;border-radius:16px;background:{{t.menu}};border:0.5px solid {{t.glassStroke}};box-shadow:{{t.menuShadow}};box-sizing:border-box">
<sc-for list="{{cmenu}}" as="m" hint-placeholder-count="4">
<sc-if value="{{m.sep}}" hint-placeholder-val="{{false}}"><div style="height:1px;background:{{t.sep}};margin:5px 12px"></div></sc-if>
<sc-if value="{{m.item}}" hint-placeholder-val="{{true}}"><div role="menuitem" style="height:44px;border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 12px;color:{{m.fg}};font-size:17px"><span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{m.l}}</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="{{m.d}}"></path></svg></div></sc-if>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1376,"height":1032}}'>
// iPad · Mac style (docs/design/ipad/IPAD_STYLE.md). Tokens are the Mac v2 tokens verbatim (MAC_STYLE.md).
// Compare is a mode of the Viewer (Single · 2-Up · Survey), not tier D: it follows light/dark (user decision 2026-10-04).
// Source: docs/design/mac/project/MAC_Compare.dc.html at touch sizes. Survey mode: IP_CompareSurvey.
const LIGHT = { content:'#FFFFFF', label:'rgba(0,0,0,0.88)', label2:'rgba(0,0,0,0.56)', label3:'rgba(0,0,0,0.28)',
  sep:'rgba(0,0,0,0.10)', fill:'rgba(0,0,0,0.05)', fill2:'#F2F2F4', pressed:'rgba(0,0,0,0.09)', track:'rgba(0,0,0,0.10)',
  glass:'rgba(255,255,255,0.72)', glassStroke:'rgba(0,0,0,0.08)', glassShadow:'0 2px 10px rgba(0,0,0,0.10)',
  accent:'#C6730E', onAccent:'#FFFFFF', red:'#FF3B30', green:'#34C759',
  accentFill:'#A35E0A', onAccentFill:'#FFFFFF', accentText:'#A35E0A', accentSoft:'rgba(198,115,14,0.14)',
  menu:'rgba(246,246,248,0.97)', menuShadow:'0 10px 30px rgba(0,0,0,0.22)',
  redText:'#C4001A', segOn:'#FFFFFF', segShadow:'0 1px 2px rgba(0,0,0,0.18)' };
const DARK = { content:'#1C1C1E', label:'rgba(255,255,255,0.90)', label2:'rgba(255,255,255,0.58)', label3:'rgba(255,255,255,0.28)',
  sep:'rgba(255,255,255,0.10)', fill:'rgba(255,255,255,0.07)', fill2:'#2C2C2E', pressed:'rgba(255,255,255,0.12)', track:'rgba(255,255,255,0.14)',
  glass:'rgba(50,50,54,0.72)', glassStroke:'rgba(255,255,255,0.10)', glassShadow:'0 2px 12px rgba(0,0,0,0.45)',
  accent:'#EB9526', onAccent:'#000000', red:'#FF453A', green:'#30D158',
  accentFill:'#EB9526', onAccentFill:'#000000', accentText:'#EB9526', accentSoft:'rgba(235,149,38,0.18)',
  menu:'rgba(40,40,44,0.97)', menuShadow:'0 10px 30px rgba(0,0,0,0.22)',
  redText:'#FF6961', segOn:'rgba(255,255,255,0.20)', segShadow:'0 1px 2px rgba(0,0,0,0.30)' };
const RED_FILL = '#D70015'; // white 13px badge text needs 4.5:1 in both appearances
const SKIES=[['#5B7FA6','#E8C39E'],['#2E4A6B','#9FB8C9'],['#7A5C8E','#F2A774'],['#3D6B5A','#C9D6A3'],['#8AA9C1','#F4E1C1'],
 ['#1F3A4D','#D98C5F'],['#4F6D7A','#DDE2C6'],['#6B4E3D','#E2B07A'],['#355C7D','#C06C84'],['#2B5876','#4E4376'],['#A3B18A','#344E41'],['#D4A373','#606C38']];
const tile=(i)=>{const s=SKIES[i%SKIES.length];return 'linear-gradient(180deg,'+s[0]+' 0%,'+s[1]+' 58%,#2F3B2F 58%,#1E271E 100%)';};
const SUN=[ ['#355C7D','#8C7A93','#E2A37A','#F2C99A'], ['#3E6688','#978399','#E9AD84','#F5D3A6'], ['#2F5372','#86728E','#DE9A72','#EFC292'],
  ['#46708F','#9E8A9E','#EDB58C','#F7DAB0'], ['#2A4A66','#7E6C88','#D8916A','#EBB98A'], ['#3A6080','#93809A','#E6A87F','#F3CF9F'] ];
const sky=(i)=>{const s=SUN[i%SUN.length];return 'linear-gradient(180deg,'+s[0]+' 0%,'+s[1]+' 38%,'+s[2]+' 60%,'+s[3]+' 66%)';};
const thumb=(i)=>{const s=SUN[i%SUN.length];return 'linear-gradient(180deg,'+s[0]+' 0%,'+s[1]+' 38%,'+s[2]+' 62%,#2F3A36 62%,#1C2420 100%)';};
const ICON = { makeSelect:'M7 7h12 M16 4l3 3-3 3 M17 17H5 M8 14l-3 3 3 3', remove:'M12 3a9 9 0 1 0 0.01 0z M8 12h8',
  keep:'M12 3a9 9 0 1 0 0.01 0z M8 12.5l3 3 5-6.5' };
// One compared photo. f: '' | 'p' | 'x'; r: stars 0-5. Stars are a radiogroup (tap the n-th star to rate n).
function photo(t, o){
  const stars=[1,2,3,4,5].map(n=>({ on: n===o.r?'true':'false', label: n+(n===1?' Star':' Stars'),
    fill: n<=o.r?t.label:'none', stroke: n<=o.r?t.label:t.label2 }));
  const fl=(name,key)=>{ const on=(o.f===key); return { name, on:on?'true':'false', bg:on?t.segOn:'transparent', shadow:on?t.segShadow:'none',
    fg: on?t.label:t.label2, fw:on?'600':'400' }; };
  const words=[o.r?(o.r+(o.r===1?' star':' stars')):'No rating', o.f==='p'?'Picked':(o.f==='x'?'Rejected, marked for deletion':'Unflagged')];
  return Object.assign({ stars, rateLabel:'Rating for '+o.name, flagLabel:'Flag for '+o.name,
    flags:[fl('None',''), fl('Pick','p'), fl('Reject','x')],
    picked:o.f==='p', rejected:o.f==='x', focus:!!o.focus,
    imgLabel:'Photo, '+o.name+', '+words.join(', ')+(o.focus?', focused':''), label:o.role+', '+o.name }, o);
}
// Filmstrip: inSet = indices being compared, focus = the focused one, rej = rejected ones.
function strip(t, inSet, focus, rej){
  const out=[];
  for(let i=0;i<12;i++){ const k=i+4507; const s=inSet.indexOf(i)>=0, f=i===focus, x=rej.indexOf(i)>=0;
    out.push({ bg: s?thumb(inSet.indexOf(i)):tile(i*5+17), op: x?'0.45':'1',
      ring: f?('inset 0 0 0 3px '+t.accent+',inset 0 0 0 5px '+t.content):(s?('inset 0 0 0 3px '+t.accent):'none'),
      label: 'Photo, DSC0'+k+'.ARW'+(s?', in comparison':'')+(f?', focused':'')+(x?', rejected':'') }); }
  return out;
}
// Long-press menu rows: '-' separator or [label, icon, destructive].
function menu(t, arr){
  return arr.map(x=>{ if(x==='-') return {sep:true, item:false};
    return {sep:false, item:true, l:x[0], d:x[1], fg:x[2]?t.redText:t.label}; });
}
class Component extends DCLogic {
  renderVals() {
    const dark=!!this.props.dark; const t = Object.assign({}, dark ? DARK : LIGHT, { redFill: RED_FILL });
    const panes=[
      photo(t,{ x:'16px', ox:'-1250px', oy:'-400px', sky:sky(0), role:'Select', roleBg:t.accentFill, roleFg:t.onAccentFill, focus:true,
        name:'DSC04512.ARW', exif:'Sony A7 IV · 35 mm · f/2.8 · 1/250 s · ISO 400', r:4, f:'p' }),
      photo(t,{ x:'696px', ox:'-1262px', oy:'-392px', sky:sky(1), role:'Candidate', roleBg:'rgba(0,0,0,0.58)', roleFg:'#FFFFFF',
        name:'DSC04513.ARW', exif:'Sony A7 IV · 35 mm · f/2.8 · 1/200 s · ISO 400', r:0, f:'x' })
    ];
    const cmenu=menu(t,[['Make Select',ICON.makeSelect],['Remove from Comparison',ICON.remove],'-',['Keep Only This',ICON.keep,true]]);
    return { t, panes, cmenu, title:'4 Photos', subtitle:'Sunday, September 27, 2026 · Nara · Candidate 1 of 3',
      deleteLabel:'Delete 1 Photo', strip:strip(t,[5,6,7,9],5,[6]), stripNote:'4 in comparison · 1 rejected' };
  }
}
</script>
</body>
</html>
