const SKIES=[['#5B7FA6','#E8C39E'],['#2E4A6B','#9FB8C9'],['#7A5C8E','#F2A774'],['#3D6B5A','#C9D6A3'],['#8AA9C1','#F4E1C1'],
 ['#1F3A4D','#D98C5F'],['#4F6D7A','#DDE2C6'],['#6B4E3D','#E2B07A'],['#355C7D','#C06C84'],['#2B5876','#4E4376'],['#A3B18A','#344E41'],['#D4A373','#606C38']];

function tile(i){ const s=SKIES[i%SKIES.length]; const h=46+((i*7)%22);

function px(v){ return v.toFixed(2)+'px'; }
function gridTiles(cols,width,top,bottom,seed,vids){
  const g=2, w=(width-g*(cols-1))/cols, out=[]; let i=0;
  for(let y=top; y<bottom; y+=w+g){ for(let c=0;c<cols;c++){ const v=vids.indexOf(i)>=0;

function dayGrid(cols,width,bottom,navBottom,secs,vids){
  const g=2, w=(width-g*(cols-1))/cols, HH=34, tiles=[], heads=[]; let y=bottom, k=0;
  for(let s=secs.length-1;s>=0;s--){ const n=secs[s].n, rows=Math.ceil(n/cols), secBottom=y;
