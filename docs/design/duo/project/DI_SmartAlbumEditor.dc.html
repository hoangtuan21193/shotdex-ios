<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":951,"height":669}}'>

const LIGHT = { bg:'#FFFFFF', grouped:'#F2F2F7', card:'#FFFFFF', label:'#000000', label2:'#6C6C70', label3:'#8E8E93',
  sep:'#C6C6C8', fill:'#E9E9EB', fill2:'#F2F2F7', glass:'rgba(255,255,255,0.78)', glassStroke:'rgba(0,0,0,0.08)',
  glassShadow:'0 4px 18px rgba(0,0,0,0.12)', tint:'#C6730E', red:'#FF3B30', green:'#34C759', orange:'#FF9500',
  accent:'#C6730E', dim:'rgba(0,0,0,0.35)', sheet:'#FFFFFF', onAccent:'#FFFFFF' };
const DARK = { bg:'#000000', grouped:'#000000', card:'#1C1C1E', label:'#FFFFFF', label2:'#98989F', label3:'#6C6C70',
  sep:'#38383A', fill:'#2C2C2E', fill2:'#1C1C1E', glass:'rgba(44,44,46,0.78)', glassStroke:'rgba(255,255,255,0.10)',
  glassShadow:'0 4px 18px rgba(0,0,0,0.5)', tint:'#EB9526', red:'#FF453A', green:'#30D158', orange:'#FF9F0A',
  accent:'#EB9526', dim:'rgba(0,0,0,0.55)', sheet:'#1C1C1E', onAccent:'#000000' };
const SKIES=[['#5B7FA6','#E8C39E'],['#2E4A6B','#9FB8C9'],['#7A5C8E','#F2A774'],['#3D6B5A','#C9D6A3'],['#8AA9C1','#F4E1C1'],
 ['#1F3A4D','#D98C5F'],['#4F6D7A','#DDE2C6'],['#6B4E3D','#E2B07A'],['#355C7D','#C06C84'],['#2B5876','#4E4376'],['#A3B18A','#344E41'],['#D4A373','#606C38']];
const DUR=['0:42','1:08','0:17','2:31','0:09'];
function tile(i){ const s=SKIES[i%SKIES.length]; const h=46+((i*7)%22);
  return 'linear-gradient(180deg,'+s[0]+' 0%,'+s[1]+' '+h+'%,#2F3B2F '+h+'%,#1E271E 100%)'; }
function cover(i){ const s=SKIES[i%SKIES.length]; return 'linear-gradient(170deg,'+s[0]+' 0%,'+s[1]+' 100%)'; }
function px(v){ return v.toFixed(2)+'px'; }
function gridTiles(cols,width,top,bottom,seed,vids){
  const g=2, w=(width-g*(cols-1))/cols, out=[]; let i=0;
  for(let y=top; y<bottom; y+=w+g){ for(let c=0;c<cols;c++){ const v=vids.indexOf(i)>=0;
    out.push({left:px(c*(w+g)), top:px(y), size:px(w), bg:tile(seed+i), durDisplay:v?'block':'none', dur:DUR[i%DUR.length]}); i++; } }
  return out; }
function dayGrid(cols,width,bottom,navBottom,secs,vids){
  const g=2, w=(width-g*(cols-1))/cols, HH=34, tiles=[], heads=[]; let y=bottom, k=0;
  for(let s=secs.length-1;s>=0;s--){ const n=secs[s].n, rows=Math.ceil(n/cols), secBottom=y;
    y-=rows*w+(rows-1)*g; const t0=y;
    for(let i=0;i<n;i++){ const r=Math.floor(i/cols), c=i%cols, ty=t0+r*(w+g); k++;
      if(ty+w>0){ const v=vids.indexOf(k)>=0; tiles.push({left:px(c*(w+g)), top:px(ty), size:px(w), bg:tile(k*5+s), durDisplay:v?'block':'none', dur:DUR[k%DUR.length]}); } }
    y-=HH; let ht=y;
    if(ht<navBottom && secBottom>navBottom){ ht=Math.min(navBottom, secBottom-HH); }
    if(ht>=navBottom-2) heads.push({top:px(ht+4), title:secs[s].title});
    y-=g; if(y<-200) break; }
  return {tiles, heads}; }


class Component extends DCLogic {
  renderVals() {
    const dk = !!this.props.dark;
    const t = dk ? DARK : LIGHT;
    const s = { sheetBg: dk ? t.card : t.grouped, cell: dk ? t.fill : t.card, chip: dk ? t.sep : t.fill, segSel: dk ? t.label3 : t.card, cell2: dk ? t.card : t.fill2 };
    return { t, s, x: 0 };
  }
}
</script>
