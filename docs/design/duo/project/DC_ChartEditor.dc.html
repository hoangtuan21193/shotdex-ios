    const MONTHS = ["Oct", "Nov", "Dec", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep"]; const SERIES = [[1450, 1210, 980, 1620, 1380, 1890, 2240, 1760, 2050, 2410, 2980, 1920], [820, 960, 1110, 740, 690, 880, 1020, 1180, 1340, 990, 1210, 860], [610, 720, 880, 930, 640, 560, 710, 690, 820, 900, 1040, 780]];

    const X = (i) => X0 + (X1 - X0) * i / (MONTHS.length - 1);
    const Y = (v) => TOP + (1 - v / YMAX) * (BOT - TOP);
    const path = (vals) => vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    const lc = { l0: path(SERIES[0]), l1: path(SERIES[1]), l2: path(SERIES[2]),
      area: path(SERIES[0]) + ' L' + X1 + ' ' + BOT + ' L' + X0 + ' ' + BOT + ' Z',
      grid: [3000, 2000, 1000, 0].map((v) => ({ y: Y(v).toFixed(1), ly: (Y(v) - 14).toFixed(1), label: fmt(v) })),
      dots: [], months: [] };
    [2, 1, 0].forEach((s) => SERIES[s].forEach((v, i) => lc.dots.push({ x: X(i).toFixed(1), y: Y(v).toFixed(1), color: P[s] })));
    [1, 3, 5, 7, 9, 11].forEach((i) => lc.months.push({ x: X(i).toFixed(1), name: MONTHS[i] }));
    // Chart type picker: the whole set, every time; a type that does not fit the X-axis is drawn disabled
    const seg = { bg: d ? 'rgba(118,118,128,0.24)' : '#E9E9EB', on: d ? '#636366' : '#FFFFFF',
      shadow: d ? 'none' : '0 1px 3px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.04)' };
    const TYPE_SEL = 'columns', TYPE_OFF = ['donut', 'bars'];
    const TYPES = [['number', 'Number', 'M9 4L7 20M17 4l-2 16M4 9h16M3 15h16'], ['donut', 'Donut', 'M12 3a9 9 0 1 0 9 9M12 3v9h9'],
      ['bars', 'Bars', 'M4 6h11M4 12h16M4 18h7'], ['columns', 'Columns', 'M6 20v-7M12 20V5M18 20V10'], ['line', 'Line', 'M3 18l5-6 4 3 8-9']];
    const types = TYPES.map((k) => { const on = k[0] === TYPE_SEL, off = TYPE_OFF.indexOf(k[0]) >= 0;
      return { name: k[1], icon: k[2], on: String(on), dis: String(off), bg: on ? seg.on : 'transparent', sh: on ? seg.shadow : 'none',
        c: off ? t.label3 : t.label, fw: on ? 600 : 500 }; });
    // Preview: Photos per Year as Columns (same rules as the Statistics card: amber 38%/45%, the busiest year full accent, 8pt air, thinned '09 labels)
    const YEARS = [[2009, 180], [2010, 260], [2011, 410], [2012, 620], [2013, 870], [2014, 1140], [2015, 1480], [2016, 1920],
      [2017, 2310], [2018, 2960], [2019, 5120], [2020, 2140], [2021, 3410], [2022, 8412], [2023, 5370], [2024, 6240], [2025, 6830], [2026, 5559]];
    const YW = 318, PREF_STEP = 3;
    const N = YEARS.length, CGAP = 8, HEAD = 30, PLOT = 120;
    const cw = (YW - CGAP * (N - 1)) / N, pitch = cw + CGAP;
    const LABEL_W = 20, LABEL_GAP = 8;
    const minStep = Math.ceil((LABEL_W + LABEL_GAP) / pitch);
    const step = Math.max(minStep, PREF_STEP);
    const shown = {}; shown[0] = true;
    for (let i = N - 1; i >= minStep; i -= step) shown[i] = true;
    let ymax = 0, imax = 0; YEARS.forEach((y, i) => { if (y[1] > ymax) { ymax = y[1]; imax = i; } });
    const ilast = N - 1, base = HEAD + PLOT;
    const cx = (i) => i * pitch + cw / 2;
    const colH = (v) => Math.max(2, Math.round(v / ymax * PLOT));
    const yc = { w: YW, h: base + 22, cw: cw.toFixed(2), base: base, ly: base + 6, cols: [], labels: [], vals: [],
      ax: 'Preview, Photos per Year column chart, 2009 to 2026; most in 2022: ' + fmt(ymax) + ' photos' };
    YEARS.forEach((y, i) => {
      const h = colH(y[1]);
      yc.cols.push({ x: (i * pitch).toFixed(2), y: base - h, h: h, bg: i === imax ? ch.acc : ch.pale });
      if (shown[i]) yc.labels.push({ x: cx(i).toFixed(2), text: '’' + String(y[0]).slice(2) });
    });
    [imax, ilast].forEach((i) => yc.vals.push({ x: Math.min(Math.max(cx(i), 16), YW - 16).toFixed(2), y: base - Math.max(colH(YEARS[i][1]), i > 0 ? colH(YEARS[i - 1][1]) : 0) - 16,
      text: fmt(YEARS[i][1]), fw: i === imax ? 600 : 500, c: i === imax ? t.label : t.label2 }));
    return { t, x: d ? XD : XL, ch, cam, lens, pair, efl, lc, seg, types, yc };
  }
}
