<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":951,"height":669}}'>
// Duo inner · Viewer opening a cloud placeholder, as built (FS-19.01b §4, AC-15/AC-16). The file in a folder source is an
// iCloud Drive placeholder; opening it downloads that one file. While downloading the page is black in light and dark
// alike and the info capsule and bottom toolbar are hidden: only the round glass Close (same spot as DI_Viewer).
// Stack: icloud.and.arrow.down 44pt white 60%, filename headline white, "Downloading from iCloud Drive…" subheadline
// white 70%, 220pt white linear bar, "29 kB of 58 kB" caption white 60% monospaced digits, bordered Cancel tinted white.
// After Cancel: bar and size line go away, subtitle "Only in iCloud Drive", button "Download".
// After the download: the normal viewer (DI_Viewer) — info capsule and toolbar appear.
function settingsTileTints(dark) {
  const C = { blue:['#007AFF','#0040DD','#0A84FF','#409CFF'], indigo:['#5856D6','#3634A3','#5E5CE6','#7D7AFF'],
    pink:['#FF2D55','#D30F45','#FF375F','#FF6482'], teal:['#30B0C7','#008299','#40C8E0','#5DE6FF'],
    brown:['#A2845E','#7F6545','#AC8E68','#B59469'], green:['#34C759','#248A3D','#30D158','#30DB5B'],
    purple:['#AF52DE','#8944AB','#BF5AF2','#DA8FFF'], cyan:['#32ADE6','#0071A4','#64D2FF','#70D7FF'],
    mint:['#00C7BE','#0C817B','#63E6E2','#66D4CF'], red:['#FF3B30','#D70015','#FF453A','#FF6961'],
    gray:['#8E8E93','#6C6C70','#98989F','#AEAEB2'], orange:['#FF9500','#C93400','#FF9F0A','#FFB340'] };
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
  const tt = { selBg:'rgba(255,255,255,0.22)', selFg:'#FFFFFF' };
  Object.keys(C).forEach((k) => { const c = C[k];
    tt[k + 'Bg'] = dark ? rgba(c[2], 0.24) : rgba(c[0], 0.14);
    tt[k + 'Fg'] = dark ? c[3] : c[1]; });
  return tt;
}
class Component extends DCLogic {
  renderVals() {
    const LIGHT = { bg:'#FFFFFF', grouped:'#F2F2F7', card:'#FFFFFF', label:'#000000', label2:'#6C6C70', label3:'#8E8E93',
      sep:'#C6C6C8', fill:'#E9E9EB', fill2:'#F2F2F7', cell2:'#F2F2F7', glass:'rgba(255,255,255,0.78)', glassStroke:'rgba(0,0,0,0.08)',
      glassShadow:'0 4px 18px rgba(0,0,0,0.12)', tint:'#C6730E', red:'#FF3B30', green:'#34C759', orange:'#FF9500',
      accent:'#C6730E', accentSoft:'rgba(198,115,14,0.12)', accentLine:'rgba(198,115,14,0.55)', dim:'rgba(0,0,0,0.35)',
      sheet:'#FFFFFF', sheetGrouped:'#F2F2F7', onAccent:'#FFFFFF', alert:'rgba(255,255,255,0.94)', alertStroke:'rgba(0,0,0,0.06)',
      alertBtn:'rgba(120,120,128,0.16)', tintSoft:'rgba(198,115,14,0.10)', ctl:'rgba(120,120,128,0.12)', segSel:'#FFFFFF', track:'rgba(120,120,128,0.20)' };
    const DARK = { bg:'#000000', grouped:'#000000', card:'#1C1C1E', label:'#FFFFFF', label2:'#98989F', label3:'#6C6C70',
      sep:'#38383A', fill:'#2C2C2E', fill2:'#1C1C1E', cell2:'#1C1C1E', glass:'rgba(44,44,46,0.78)', glassStroke:'rgba(255,255,255,0.10)',
      glassShadow:'0 4px 18px rgba(0,0,0,0.5)', tint:'#EB9526', red:'#FF453A', green:'#30D158', orange:'#FF9F0A',
      accent:'#EB9526', accentSoft:'rgba(235,149,38,0.20)', accentLine:'rgba(235,149,38,0.60)', dim:'rgba(0,0,0,0.55)',
      sheet:'#1C1C1E', sheetGrouped:'#000000', onAccent:'#000000', alert:'rgba(44,44,46,0.94)', alertStroke:'rgba(255,255,255,0.08)',
      alertBtn:'rgba(120,120,128,0.32)', tintSoft:'rgba(235,149,38,0.22)', ctl:'rgba(120,120,128,0.24)', segSel:'#636366', track:'rgba(120,120,128,0.36)' };
    const t = this.props.dark ? DARK : LIGHT;
    return { t, tt: settingsTileTints(!!this.props.dark) };
  }
}
