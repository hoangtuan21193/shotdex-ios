  acros:   {sky:'linear-gradient(180deg,#5A5A5A 0%,#848484 50%,#B0B0B0 82%)', far:'#363636', hill:'#4E4E4E', fall:'#F2F2F2', pool:'#DADADA', ground:'#222222'},
  chrome:  {sky:'linear-gradient(180deg,#5E7486 0%,#82909A 50%,#ABA898 82%)', far:'#3E4743', hill:'#57653F', fall:'#E3E6E3', pool:'#D5D9D5', ground:'#323A2B'},
  neg:     {sky:'linear-gradient(180deg,#5D7C88 0%,#8A9C9C 50%,#C2B39A 82%)', far:'#3F4A43', hill:'#5E6A3E', fall:'#ECE6DA', pool:'#DCD5C6', ground:'#343726'},
  astia:   {sky:'linear-gradient(180deg,#6A88A8 0%,#8FA2B2 50%,#C2B8A6 82%)', far:'#45524F', hill:'#5A7448', fall:'#EDF1F2', pool:'#E1E7E8', ground:'#36462F'},
  provia:  {sky:'linear-gradient(180deg,#527BA6 0%,#7A97AE 50%,#B6B3A2 82%)', far:'#384A46', hill:'#4A6E3C', fall:'#EAF0F2', pool:'#DCE5E7', ground:'#2B4027'}
};
const pc = (x)=>(x*100).toFixed(1)+'%';
// One inspector slider row. v: -1…1 (bipolar, tick at 0) or 0…1 with o.uni.
function sl(label, value, v, o){ o=o||{}; const uni=!!o.uni; const p = uni ? v : (v+1)/2;
  const a = uni?0:Math.min(p,0.5), b = uni?p:Math.max(p,0.5);
  return { label, value, pos:pc(p), fl:pc(a), fw:pc(b-a), track:o.track||t.sliderTrack, top:o.dis?0.5:1,
    fill:o.track?'rgba(0,0,0,0)':(o.dis?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.62)'), tick:!uni && !o.track,
    knob:o.dis?'#5C5C5E':'#ECECEE', lc:o.dis?t.dim:t.label, vc:o.dis?t.dim:t.label,
    vb:o.hover?'rgba(255,255,255,0.24)':'rgba(0,0,0,0)', vbg:o.hover?'rgba(255,255,255,0.06)':'rgba(0,0,0,0)',
    bg:o.hover?t.hover:'rgba(0,0,0,0)', z:o.hover?5:0, tip:o.tip||'', scrub:!!o.scrub }; }
const EXIF = { iso:'ISO 400', fl:'56 mm', ap:'f/1.4', ss:'1/250 s' };
function film(n, o){ o=o||{}; const out=[]; for(let i=0;i<n;i++){ const k=i+(o.seed||3);
  const active=i===(o.active==null?2:o.active); const sel=(o.sel||[]).indexOf(i)>=0;
  out.push({ bg:tile(k*5+3), label:'Photo '+(i+1)+(active?', current':'')+(sel?', selected':''),
    edited:(o.edited||[]).indexOf(i)>=0, warn:(o.warn||[]).indexOf(i)>=0, shade:(o.dimOthers && !active && !sel)?0.45:0,
    ring: active?((o.sel||[]).length?'inset 0 0 0 3px #FFFFFF':'inset 0 0 0 2px #FFFFFF'):(sel?'inset 0 0 0 1.5px rgba(255,255,255,0.85)':'inset 0 0 0 1px rgba(255,255,255,0.08)') }); }
  return out; }


const BANDS = { Red:['#D93A7A','#E8453A','#E8802A'], Orange:['#E8503A','#EB8E2A','#E6C52A'], Yellow:['#EB962A','#E6C92A','#A6D12E'],
  Green:['#C2CF2E','#4CC24A','#2EC29E'], Aqua:['#3CC48A','#2EC2C4','#2E8CE0'], Blue:['#2EB2D2','#2E6CE0','#6A4CE0'],
  Purple:['#4C5CE0','#8A4CE0','#C44CD2'], Magenta:['#9A4CE0','#D24CB2','#E8427A'] };
const g3 = (c)=>'linear-gradient(90deg,'+c[0]+','+c[1]+','+c[2]+')';
class Component extends DCLogic {
  renderVals() {
    const mv = {Red:['0',0],Orange:['+8',0.08],Yellow:['−12',-0.12],Green:['−24',-0.24],Aqua:['−6',-0.06],Blue:['−18',-0.18],Purple:['0',0],Magenta:['0',0]};
    const mixer = Object.keys(BANDS).map(k=>sl(k, mv[k][0], mv[k][1], {track:g3(BANDS[k])}));
    const point = [ sl('Hue','+4',0.04,{track:'linear-gradient(90deg,#6E9A8F,#6E8FA8,#7A7AA8)'}), sl('Saturation','−22',-0.22,{track:'linear-gradient(90deg,#8A8A8A,#3F86C8)'}),
      sl('Luminance','+10',0.10,{track:'linear-gradient(90deg,#1E2A36,#B8D2EA)'}), sl('Range','50',0.5,{uni:true}) ];
    const grade = [ sl('Hue','214°',214/360,{uni:true,track:'linear-gradient(90deg,#FF3B30,#FFCC00,#34C759,#32ADE6,#5856D6,#FF2D55,#FF3B30)'}),
      sl('Saturation','18',0.18,{uni:true,track:'linear-gradient(90deg,#808080,#2E6CE0)'}), sl('Luminance','−4',-0.04),
      sl('Blending','50',0.5,{uni:true}), sl('Balance','0',0) ];
    // 10x10 pixel loupe: sky around #6E8FA8, one pixel per cell
    const cells=[]; for(let r=0;r<10;r++){ for(let c=0;c<10;c++){ const n=((r*7+c*13)%9)-4; const R=110+n*2+r, G=143+n*2+Math.round(r*0.6), B=168+n*2-Math.round(r*0.4);
      cells.push('rgb('+R+','+G+','+B+')'); } }
    return { t, sc:SCENES.chrome, exif:EXIF, mixer, point, grade, cells, hex:'#6E8FA8', loupeRing:'#6E8FA8', film:film(11,{active:2, edited:[0,1,2,5]}) };
  }
}
