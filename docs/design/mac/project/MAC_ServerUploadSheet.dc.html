<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mac · Upload to Server sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font-family:inherit;padding:0;margin:0;cursor:default}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 520px; height: 420px; position: relative; overflow: hidden; border-radius: 16px; background: {{t.sheet}}; color: {{t.label}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 13px">
<!-- File › Upload to Server… ⇧⌘U on the selected photos: a sheet on the Library window (FS-15.02 §9). Progress and conflicts stay in this sheet until row 25c moves them to Activity. -->
<div style="position:absolute;left:20px;top:20px;font-size:13px;font-weight:700">Upload to Server</div>
<div role="form" aria-label="Upload to Server" style="position:absolute;left:20px;right:20px;top:52px;border-radius:10px;background:{{t.field}};border:1px solid {{t.sep}};overflow:hidden">
<div style="display:flex;align-items:center;height:44px;padding:0 14px"><span style="flex:1">Connection</span><span style="display:flex;align-items:center;gap:6px">Test SMB<span style="width:16px;height:16px;border-radius:4px;background:{{t.fill}};display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:{{t.label2}}">⌃⌄</span></span></div>
<div style="display:flex;align-items:center;height:44px;padding:0 14px;border-top:1px solid {{t.sep}}"><span style="flex:1">Folder</span><span aria-label="Folder" style="color:{{t.label}}">photos/Uploads</span></div>
<div style="display:flex;align-items:center;height:44px;padding:0 14px;border-top:1px solid {{t.sep}}"><span style="flex:1">Date Folders</span><span role="switch" aria-checked="false" aria-label="Date Folders" style="position:relative;width:32px;height:18px;border-radius:9px;background:{{t.track}}"><span style="position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:7px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,0.3)"></span></span></div>
<div style="padding:8px 14px;border-top:1px solid {{t.sep}};font-size:11px;color:{{t.label2}}">Photos go straight into this folder.</div>
<div style="display:flex;align-items:center;height:44px;padding:0 14px;border-top:1px solid {{t.sep}}"><span style="flex:1">Files</span><span style="display:flex;align-items:center;gap:6px">All Originals<span style="width:16px;height:16px;border-radius:4px;background:{{t.fill}};display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:{{t.label2}}">⌃⌄</span></span></div>
<div style="padding:12px 14px;border-top:1px solid {{t.sep}};font-variant-numeric:tabular-nums">3 photos · 3 files · ~1.2 MB</div>
</div>
<div style="position:absolute;left:0;right:0;bottom:68px;height:1px;background:{{t.sep}}"></div>
<div style="position:absolute;right:20px;bottom:16px;display:flex;gap:12px">
<button title="Esc" style="height:28px;padding:0 14px;border-radius:7px;border:none;background:{{t.fill}};color:{{t.label}};font-size:13px">Cancel</button>
<button title="Return" style="height:28px;padding:0 14px;border-radius:7px;border:none;background:{{t.accentFill}};color:{{t.onAccentFill}};font-size:13px;font-weight:600">Upload</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":520,"height":420}}'>
const LIGHT = { content:'#FFFFFF', label:'rgba(0,0,0,0.88)', label2:'rgba(0,0,0,0.56)', label3:'rgba(0,0,0,0.28)',
  sep:'rgba(0,0,0,0.10)', fill:'rgba(0,0,0,0.05)', fill2:'#F2F2F4', pressed:'rgba(0,0,0,0.09)', track:'rgba(0,0,0,0.10)',
  glass:'rgba(255,255,255,0.72)', glassStroke:'rgba(0,0,0,0.08)', glassShadow:'0 2px 10px rgba(0,0,0,0.10)',
  sidebar:'rgba(244,244,247,0.86)', sidebarShadow:'0 8px 28px rgba(0,0,0,0.12)', rowSel:'rgba(0,0,0,0.08)',
  accent:'#C6730E', onAccent:'#FFFFFF', red:'#FF3B30', green:'#34C759', orange:'#FF9500',
  accentFill:'#A35E0A', onAccentFill:'#FFFFFF', accentText:'#A35E0A', accentSoft:'rgba(198,115,14,0.14)', focusRing:'rgba(198,115,14,0.45)',
  menu:'rgba(246,246,248,0.97)', menuShadow:'0 10px 30px rgba(0,0,0,0.22)',
  sheet:'#F6F6F8', sheetShadow:'0 24px 60px rgba(0,0,0,0.28)', scrim:'rgba(0,0,0,0.18)', rowAlt:'rgba(0,0,0,0.03)',
  field:'#FFFFFF', redText:'#C4001A', greenText:'#1F7A35', orangeText:'#9A5200',
  segOn:'#FFFFFF', segShadow:'0 1px 2px rgba(0,0,0,0.18)', checkboxStroke:'rgba(0,0,0,0.25)' };
const DARK = { content:'#1C1C1E', label:'rgba(255,255,255,0.90)', label2:'rgba(255,255,255,0.58)', label3:'rgba(255,255,255,0.28)',
  sep:'rgba(255,255,255,0.10)', fill:'rgba(255,255,255,0.07)', fill2:'#2C2C2E', pressed:'rgba(255,255,255,0.12)', track:'rgba(255,255,255,0.14)',
  glass:'rgba(50,50,54,0.72)', glassStroke:'rgba(255,255,255,0.10)', glassShadow:'0 2px 12px rgba(0,0,0,0.45)',
  sidebar:'rgba(38,38,42,0.86)', sidebarShadow:'0 8px 28px rgba(0,0,0,0.5)', rowSel:'rgba(255,255,255,0.10)',
  accent:'#EB9526', onAccent:'#000000', red:'#FF453A', green:'#30D158', orange:'#FF9F0A',
  accentFill:'#EB9526', onAccentFill:'#000000', accentText:'#EB9526', accentSoft:'rgba(235,149,38,0.18)', focusRing:'rgba(235,149,38,0.50)',
  menu:'rgba(40,40,44,0.97)', menuShadow:'0 10px 30px rgba(0,0,0,0.22)',
  sheet:'#2A2A2D', sheetShadow:'0 24px 60px rgba(0,0,0,0.60)', scrim:'rgba(0,0,0,0.35)', rowAlt:'rgba(255,255,255,0.04)',
  field:'#1C1C1E', redText:'#FF6961', greenText:'#30D158', orangeText:'#FFB340',
  segOn:'rgba(255,255,255,0.20)', segShadow:'0 1px 2px rgba(0,0,0,0.30)', checkboxStroke:'rgba(255,255,255,0.30)' };
class Component extends DCLogic {
  renderVals() {
    const t = this.props.dark ? DARK : LIGHT;
    return { t };
  }
}
</script>
</body>
</html>
