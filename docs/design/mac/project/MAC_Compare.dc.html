<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mac · Viewer · 2-Up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font-family:inherit;padding:0;margin:0;cursor:default}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; border-radius: 16px; background: {{t.content}}; color: {{t.label}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 13px">
<!-- 2-UP: the Viewer in Compare mode. Select left, Candidate right; zoom and pan move together; P/X act on the focused pane -->
<sc-for list="{{panes}}" as="p" hint-placeholder-count="2">
<section aria-label="{{p.label}}" style="position:absolute;left:{{p.x}};top:64px;width:700px;height:740px"><div role="img" aria-label="{{p.imgLabel}}" style="position:absolute;left:0;top:0;width:700px;height:688px;border-radius:8px;overflow:hidden;background:{{t.fill2}}"><div style="position:absolute;left:{{p.ox}};top:{{p.oy}};width:2400px;height:1600px"><div style="position:absolute;inset:0;background:{{p.sky}}"></div><div style="position:absolute;left:66.3%;top:33.8%;width:127px;height:127px;margin-left:-2.65%;border-radius:50%;background:#FBE3B8;opacity:0.9"></div><div style="position:absolute;inset:0;background:#4D4A5A;clip-path:polygon(0% 62%,12% 52%,24% 58%,38% 44%,50% 54%,63% 47%,78% 57%,90% 50%,100% 56%,100% 100%,0% 100%)"></div><div style="position:absolute;inset:0;background:#2F3A36;clip-path:polygon(0% 72%,16% 66%,30% 73%,47% 63%,62% 71%,80% 64%,100% 70%,100% 100%,0% 100%)"></div><div style="position:absolute;inset:0;background:#1C2420;clip-path:polygon(0% 84%,20% 80%,42% 86%,64% 79%,84% 84%,100% 80%,100% 100%,0% 100%)"></div></div><div style="position:absolute;left:10px;top:10px;display:flex;gap:6px"><sc-if value="{{p.hasRole}}" hint-placeholder-val="{{true}}"><span style="height:20px;padding:0 8px;border-radius:10px;background:{{p.roleBg}};color:{{p.roleFg}};font-size:11px;font-weight:600;line-height:20px">{{p.role}}</span></sc-if></div><sc-if value="{{p.picked}}" hint-placeholder-val="{{false}}"><span style="position:absolute;right:10px;top:10px;height:20px;padding:0 8px 0 6px;border-radius:10px;background:rgba(0,0,0,0.58);color:#FFFFFF;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px"><svg width="10" height="10" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><path d="M6 3v18 M6 4h12l-3 4.5 3 4.5H6z"></path></svg>Picked</span></sc-if><sc-if value="{{p.rejected}}" hint-placeholder-val="{{false}}"><span style="position:absolute;right:10px;top:10px;height:20px;padding:0 8px 0 6px;border-radius:10px;background:{{t.redFill}};color:#FFFFFF;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12 M18 6L6 18"></path></svg>Rejected</span></sc-if><span style="position:absolute;left:10px;bottom:10px;height:20px;padding:0 8px;border-radius:10px;background:rgba(0,0,0,0.58);color:#FFFFFF;font-size:11px;font-weight:600;line-height:20px;font-variant-numeric:tabular-nums">100%</span></div><sc-if value="{{p.focus}}" hint-placeholder-val="{{true}}"><div aria-hidden="true" style="position:absolute;left:-4px;top:-4px;width:708px;height:696px;border:2px solid {{t.accent}};border-radius:11px;box-sizing:border-box"></div></sc-if><div style="position:absolute;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;gap:12px;padding:0 2px;box-sizing:border-box"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{p.name}}</span><span style="font-size:11px;color:{{t.label2}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums">{{p.exif}}</span></div><span role="img" aria-label="{{p.starLabel}}" style="display:flex;align-items:center;gap:1px;flex:none"><sc-for list="{{p.stars}}" as="s" hint-placeholder-count="5"><svg width="11" height="11" viewBox="0 0 24 24" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"></path></svg></sc-for></span><div role="radiogroup" aria-label="Flag for {{p.name}}" style="height:28px;border-radius:8px;background:{{t.fill}};padding:2px;box-sizing:border-box;display:flex;flex:none"><sc-for list="{{p.flags}}" as="f" hint-placeholder-count="3"><button role="radio" aria-checked="{{f.on}}" title="{{f.tip}}" style="height:24px;padding:0 10px;border-radius:6px;border:none;background:{{f.bg}};box-shadow:{{f.shadow}};color:{{f.fg}};font-size:12px;font-weight:{{f.fw}};white-space:nowrap">{{f.name}}</button></sc-for></div></div></section>
</sc-for>
<!-- FILMSTRIP: the photos being compared carry the amber ring; the focused one adds the inner gap -->
<div aria-label="Filmstrip" style="position:absolute;left:0;right:0;top:812px;bottom:0;border-top:1px solid {{t.sep}};box-sizing:border-box"><div style="position:absolute;left:314px;top:11px;display:flex;gap:4px"><sc-for list="{{strip}}" as="f" hint-placeholder-count="12"><div aria-label="{{f.label}}" style="position:relative;width:64px;height:64px;box-sizing:border-box;border-radius:4px;overflow:hidden"><div style="position:absolute;inset:0;background:{{f.bg}};opacity:{{f.op}}"></div><div style="position:absolute;inset:0;border-radius:4px;box-shadow:{{f.ring}}"></div></div></sc-for></div><div style="position:absolute;right:16px;top:0;bottom:0;display:flex;align-items:center;font-size:11px;color:{{t.label2}};font-variant-numeric:tabular-nums">{{stripNote}}</div></div>
<!-- TOOLBAR: [sidebar · back · forward] title … [Single · 2-Up · Survey] [zoom · actions · inspector] Edit -->
<div style="position:absolute;left:84px;right:16px;top:8px;height:44px;display:flex;align-items:center;gap:12px">
<div style="height:36px;border-radius:18px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);display:flex;align-items:center;padding:0 2px"><button aria-label="Show Sidebar" title="Show Sidebar (⌃⌘S)" style="width:36px;background:none;height:32px;border:none;display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z M9 5v14"></path></svg></button><div style="width:1px;height:18px;background:{{t.sep}};margin:0 3px;flex:none"></div><button aria-label="Back" title="Back to All Photos (Esc)" style="width:34px;background:none;height:32px;border:none;display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button><button aria-label="Forward" disabled style="width:34px;background:none;height:32px;border:none;display:flex;align-items:center;justify-content:center;color:{{t.label3}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button></div>
<div style="display:flex;flex-direction:column;gap:1px;min-width:0"><div style="font-size:15px;font-weight:600;line-height:18px;white-space:nowrap">4 Photos</div><div style="font-size:11px;color:{{t.label2}};line-height:13px;white-space:nowrap;font-variant-numeric:tabular-nums">Sunday, September 27, 2026 · Nara · Candidate 1 of 3</div></div>
<div style="flex:1"></div>
<div role="radiogroup" aria-label="Viewer Mode" style="height:36px;border-radius:18px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);display:flex;align-items:center;padding:0 2px;gap:0"><button role="radio" aria-checked="false" title="Single" style="height:32px;padding:0 14px;border-radius:16px;border:none;background:none;color:{{t.label2}};font-size:13px;font-weight:500;white-space:nowrap">Single</button><button role="radio" aria-checked="true" title="2-Up (⌥⌘C)" style="height:32px;padding:0 14px;border-radius:16px;border:none;background:{{t.pressed}};color:{{t.label}};font-size:13px;font-weight:600;white-space:nowrap">2-Up</button><button role="radio" aria-checked="false" title="Survey" style="height:32px;padding:0 14px;border-radius:16px;border:none;background:none;color:{{t.label2}};font-size:13px;font-weight:500;white-space:nowrap">Survey</button></div>
<div style="height:36px;border-radius:18px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);display:flex;align-items:center;padding:0 2px"><button aria-label="Zoom" title="Zoom (Z toggles Fit and 100%)" style="height:32px;padding:0 8px 0 12px;border:none;background:none;color:{{t.label}};font-size:13px;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;white-space:nowrap">100%<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="{{t.label2}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5-5 5 5 M7 15l5 5 5-5"></path></svg></button><div style="width:1px;height:18px;background:{{t.sep}};margin:0 3px;flex:none"></div><button aria-label="Sync Zoom and Pan" aria-pressed="true" title="Sync Zoom and Pan" style="width:36px;border-radius:15px;background:{{t.pressed}};height:30px;border:none;display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></button><button aria-label="Make Select" title="Make Candidate the Select (↑)" style="width:36px;background:none;height:32px;border:none;display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12 M16 4l3 3-3 3 M17 17H5 M8 14l-3 3 3 3"></path></svg></button><button aria-label="Share" style="width:36px;background:none;height:32px;border:none;display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12 M8 7l4-4 4 4 M5 12v8h14v-8"></path></svg></button><div style="width:1px;height:18px;background:{{t.sep}};margin:0 3px;flex:none"></div><button aria-label="Show Inspector" aria-pressed="false" title="Show Inspector (⌥⌘I)" style="width:36px;background:none;height:32px;border:none;display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z M15 5v14"></path></svg></button></div>
<button title="Edit (↩)" style="height:36px;border-radius:18px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);color:{{t.label}};display:flex;align-items:center;gap:6px;padding:0 16px 0 13px;font-size:13px;font-weight:600;flex:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4 7h10 M18 7h2 M4 17h4 M12 17h8 M16 4v6 M10 14v6"></path></svg>Edit</button>
</div>
<!-- Window controls (sidebar hidden while the viewer is open; Esc or Back returns to the grid) -->
<div style="position:absolute;left:20px;top:24px;display:flex;gap:8px">
<div style="width:12px;height:12px;border-radius:6px;background:#FF5F57;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.2)"></div>
<div style="width:12px;height:12px;border-radius:6px;background:#FEBC2E;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.2)"></div>
<div style="width:12px;height:12px;border-radius:6px;background:#28C840;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.2)"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
const LIGHT = { content:'#FFFFFF', label:'rgba(0,0,0,0.88)', label2:'rgba(0,0,0,0.56)', label3:'rgba(0,0,0,0.28)',
  sep:'rgba(0,0,0,0.10)', fill:'rgba(0,0,0,0.05)', fill2:'#F2F2F4', pressed:'rgba(0,0,0,0.09)', track:'rgba(0,0,0,0.10)',
  glass:'rgba(255,255,255,0.72)', glassStroke:'rgba(0,0,0,0.08)', glassShadow:'0 2px 10px rgba(0,0,0,0.10)',
  sidebar:'rgba(244,244,247,0.86)', sidebarShadow:'0 8px 28px rgba(0,0,0,0.12)', rowSel:'rgba(0,0,0,0.08)',
  accent:'#C6730E', onAccent:'#FFFFFF', red:'#FF3B30', green:'#34C759',
  accentFill:'#A35E0A', onAccentFill:'#FFFFFF', accentText:'#A35E0A', accentSoft:'rgba(198,115,14,0.14)', focusRing:'rgba(198,115,14,0.45)',
  menu:'rgba(246,246,248,0.97)', menuShadow:'0 10px 30px rgba(0,0,0,0.22)', sheet:'#F6F6F8', scrim:'rgba(0,0,0,0.18)',
  rowAlt:'rgba(0,0,0,0.03)', field:'#FFFFFF', redText:'#C4001A', greenText:'#1F7A35', segOn:'#FFFFFF', segShadow:'0 1px 2px rgba(0,0,0,0.18)' };
const DARK = { content:'#1C1C1E', label:'rgba(255,255,255,0.90)', label2:'rgba(255,255,255,0.58)', label3:'rgba(255,255,255,0.28)',
  sep:'rgba(255,255,255,0.10)', fill:'rgba(255,255,255,0.07)', fill2:'#2C2C2E', pressed:'rgba(255,255,255,0.12)', track:'rgba(255,255,255,0.14)',
  glass:'rgba(50,50,54,0.72)', glassStroke:'rgba(255,255,255,0.10)', glassShadow:'0 2px 12px rgba(0,0,0,0.45)',
  sidebar:'rgba(38,38,42,0.86)', sidebarShadow:'0 8px 28px rgba(0,0,0,0.5)', rowSel:'rgba(255,255,255,0.10)',
  accent:'#EB9526', onAccent:'#000000', red:'#FF453A', green:'#30D158',
  accentFill:'#EB9526', onAccentFill:'#000000', accentText:'#EB9526', accentSoft:'rgba(235,149,38,0.18)', focusRing:'rgba(235,149,38,0.50)',
  menu:'rgba(40,40,44,0.97)', menuShadow:'0 10px 30px rgba(0,0,0,0.22)', sheet:'#2A2A2D', scrim:'rgba(0,0,0,0.35)',
  rowAlt:'rgba(255,255,255,0.04)', field:'#1C1C1E', redText:'#FF6961', greenText:'#30D158', segOn:'rgba(255,255,255,0.20)', segShadow:'none' };
const SKIES=[['#5B7FA6','#E8C39E'],['#2E4A6B','#9FB8C9'],['#7A5C8E','#F2A774'],['#3D6B5A','#C9D6A3'],['#8AA9C1','#F4E1C1'],
 ['#1F3A4D','#D98C5F'],['#4F6D7A','#DDE2C6'],['#6B4E3D','#E2B07A'],['#355C7D','#C06C84'],['#2B5876','#4E4376'],['#A3B18A','#344E41'],['#D4A373','#606C38']];
const tile=(i)=>{const s=SKIES[i%SKIES.length];return 'linear-gradient(180deg,'+s[0]+' 0%,'+s[1]+' 58%,#2F3B2F 58%,#1E271E 100%)';};

const RED_FILL = { light:'#D70015', dark:'#D70015' }; // white 11px text needs 4.5:1 in both appearances
const SUN=[ ['#355C7D','#8C7A93','#E2A37A','#F2C99A'], ['#3E6688','#978399','#E9AD84','#F5D3A6'], ['#2F5372','#86728E','#DE9A72','#EFC292'],
  ['#46708F','#9E8A9E','#EDB58C','#F7DAB0'], ['#2A4A66','#7E6C88','#D8916A','#EBB98A'], ['#3A6080','#93809A','#E6A87F','#F3CF9F'] ];
const sky=(i)=>{const s=SUN[i%SUN.length];return 'linear-gradient(180deg,'+s[0]+' 0%,'+s[1]+' 38%,'+s[2]+' 60%,'+s[3]+' 66%)';};
const thumb=(i)=>{const s=SUN[i%SUN.length];return 'linear-gradient(180deg,'+s[0]+' 0%,'+s[1]+' 38%,'+s[2]+' 62%,#2F3A36 62%,#1C2420 100%)';};
// One compared photo. f: '' | 'p' | 'x'; r: stars 0-5.
function photo(t, o){
  const stars=[1,2,3,4,5].map(n=>({ fill: n<=o.r?t.label:'none', stroke: n<=o.r?t.label:t.label2 }));
  const fl=(name,key,tip)=>{ const on=(o.f===key); return { name, tip, on:on?'true':'false', bg:on?t.segOn:'transparent', shadow:on?t.segShadow:'none',
    fg: on?t.label:t.label2, fw:on?'600':'400' }; };
  const words=[o.r?(o.r+(o.r===1?' star':' stars')):'No rating', o.f==='p'?'Picked':(o.f==='x'?'Rejected':'Unflagged')];
  return Object.assign({ stars, starLabel: o.r?(o.r+(o.r===1?' star':' stars')):'No rating',
    flags:[fl('None','','Clear Flag (U)'), fl('Pick','p','Pick (P)'), fl('Reject','x','Reject (X)')],
    picked:o.f==='p', rejected:o.f==='x', op:o.f==='x'?'0.45':'1', focus:!!o.focus, hasRole:!!o.role,
    imgLabel:'Photo, '+o.name+', '+words.join(', ')+(o.focus?', focused':''), label:(o.role?o.role+', ':'')+o.name }, o);
}
// Filmstrip: inSet = indices being compared, focus = the focused one, rej = rejected ones.
function strip(t, inSet, focus, rej){
  const out=[];
  for(let i=0;i<12;i++){ const k=i+4507; const s=inSet.indexOf(i)>=0, f=i===focus, x=rej.indexOf(i)>=0;
    out.push({ bg: s?thumb(inSet.indexOf(i)):tile(i*5+17), op: x?'0.45':'1',
      ring: f?('inset 0 0 0 2px '+t.accent+',inset 0 0 0 4px '+t.content):(s?('inset 0 0 0 2px '+t.accent):'none'),
      label: 'Photo, DSC0'+k+'.ARW'+(s?', in comparison':'')+(f?', focused':'')+(x?', rejected':'') }); }
  return out;
}

class Component extends DCLogic {
  renderVals() {
    const dark=!!this.props.dark; const t = Object.assign({}, dark ? DARK : LIGHT, { redFill: dark?RED_FILL.dark:RED_FILL.light });
    const panes=[
      photo(t,{ x:'16px', ox:'-1100px', oy:'-440px', sky:sky(0), role:'Select', roleBg:t.accentFill, roleFg:t.onAccentFill, focus:true,
        name:'DSC04512.ARW', exif:'Sony A7 IV · 35 mm · f/2.8 · 1/250 s · ISO 400', r:4, f:'p' }),
      photo(t,{ x:'724px', ox:'-1112px', oy:'-432px', sky:sky(1), role:'Candidate', roleBg:'rgba(0,0,0,0.58)', roleFg:'#FFFFFF',
        name:'DSC04513.ARW', exif:'Sony A7 IV · 35 mm · f/2.8 · 1/200 s · ISO 400', r:0, f:'x' })
    ];
    return { t, panes, strip:strip(t,[5,6,7,9],5,[6]), stripNote:'4 in comparison' };
  }
}

</script>
</body>
</html>
