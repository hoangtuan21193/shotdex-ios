<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mac · Menu Bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font-family:inherit;padding:0;margin:0;cursor:default}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 1716px; height: 1250px; position: relative; overflow: hidden; border-radius: 16px; background: {{t.content}}; color: {{t.label}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 13px">
<!-- Desktop wallpaper (plain gradient) -->
<div style="position:absolute;inset:0;background:{{wall.bg}}"></div>
<!-- MENU BAR: ShotDex · File · Edit · View · Image · Controls · Go · Window · Help -->
<div role="menubar" aria-label="Menu bar" style="position:absolute;left:0;right:0;top:0;height:26px;background:{{bar.bg}};backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);display:flex;align-items:center;padding:0 10px;font-size:13px;color:{{bar.fg}}">
<span aria-label="Apple menu" style="width:30px;display:flex;align-items:center;justify-content:center"><svg width="13" height="15" viewBox="0 0 24 28"><path d="M19.6 14.9c0-3.3 2.7-4.9 2.8-5-1.5-2.3-3.9-2.6-4.7-2.6-2-.2-3.9 1.2-4.9 1.2s-2.6-1.2-4.3-1.1c-2.2 0-4.2 1.3-5.3 3.2-2.3 4-.6 9.8 1.6 13 1.1 1.6 2.4 3.3 4.1 3.3 1.6-.1 2.3-1.1 4.3-1.1s2.5 1.1 4.3 1 2.8-1.6 3.9-3.2c1.2-1.8 1.7-3.6 1.8-3.7-.1 0-3.4-1.3-3.4-5z M16.4 5.3c.9-1.1 1.5-2.6 1.3-4.1-1.3.1-2.8.9-3.8 2-.8.9-1.6 2.5-1.4 4 1.5.1 2.9-.8 3.9-1.9z" fill="currentColor"></path></svg></span>
<sc-for list="{{barItems}}" as="b" hint-placeholder-count="9"><span role="menuitem" style="height:22px;padding:0 9px;border-radius:6px;display:flex;align-items:center;font-weight:{{b.fw}}">{{b.l}}</span></sc-for>
<span style="flex:1"></span>
<span style="display:flex;align-items:center;gap:14px;font-size:13px;font-variant-numeric:tabular-nums">
<svg aria-label="Wi-Fi" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2.5 9a14 14 0 0 1 19 0 M5.5 12.5a9.5 9.5 0 0 1 13 0 M8.8 16a4.8 4.8 0 0 1 6.4 0 M12 19.5h.01"></path></svg>
<svg aria-label="Battery" width="24" height="14" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="0.6" y="0.6" width="21.5" height="12.8" rx="3.5"></rect><rect x="2.5" y="2.5" width="14" height="9" rx="1.8" fill="currentColor" stroke="none"></rect><path d="M24 5v4" stroke-width="1.8" stroke-linecap="round"></path></svg>
<span>Sun Oct 4  9:41 AM</span>
</span>
</div>
<!-- Every menu, open side by side as a map. Positions are computed in renderVals (stacked per column). -->
<sc-for list="{{panels}}" as="P" hint-placeholder-count="20">
<div style="position:absolute;left:{{P.x}};top:{{P.y}};width:{{P.w}};display:flex;flex-direction:column;gap:4px">
<div style="height:18px;font-size:12px;font-weight:600;color:{{wall.text}};text-shadow:{{wall.shadow}};white-space:nowrap">{{P.title}}</div>
<div role="menu" aria-label="{{P.title}}" style="padding:5px;border-radius:10px;background:{{t.menu}};border:0.5px solid {{t.glassStroke}};box-shadow:{{t.menuShadow}};box-sizing:border-box;font-size:13px;font-size:{{P.fs}}">
<sc-for list="{{P.rows}}" as="m" hint-placeholder-count="12">
<sc-if value="{{m.sep}}" hint-placeholder-val="{{false}}"><div style="height:1px;background:{{t.sep}};margin:4px 10px"></div></sc-if>
<sc-if value="{{m.head}}" hint-placeholder-val="{{false}}"><div style="height:{{P.rh}};padding:0 10px 0 24px;font-size:11px;font-weight:600;color:{{t.label2}};display:flex;align-items:center">{{m.l}}</div></sc-if>
<sc-if value="{{m.item}}" hint-placeholder-val="{{true}}"><div role="menuitem" aria-disabled="{{m.dis}}" style="height:{{P.rh}};border-radius:5px;display:flex;align-items:center;padding:0 10px 0 4px;background:{{m.bg}};color:{{m.fg}}">
<span style="width:{{P.cw}};flex:none;font-size:11px;font-weight:600;text-align:center">{{m.check}}</span>
<span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{m.l}}</span>
<span style="flex:none;padding-left:{{m.kp}};color:{{m.kc}};white-space:nowrap;letter-spacing:0.5px">{{m.k}}</span>
<sc-if value="{{m.sub}}" hint-placeholder-val="{{false}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-left:4px"><path d="M9 6l6 6-6 6"></path></svg></sc-if>
</div></sc-if>
</sc-for>
</div>
</div>
</sc-for>
<!-- When Video Studio is the key window: the Image slot becomes Clip, File › Export… takes ⌘E -->
<div role="group" aria-label="When Video Studio is the key window" style="position:absolute;left:{{vs.x}};top:{{vs.y}};width:{{vs.w}};height:{{vs.h}};border-radius:16px;border:1px dashed {{wall.line}};box-sizing:border-box"></div>
<div style="position:absolute;left:{{vs.tx}};top:{{vs.ty}};width:{{vs.tw}};display:flex;flex-direction:column;gap:8px">
<div style="font-size:13px;font-weight:600;color:{{wall.text}};text-shadow:{{wall.shadow}}">When Video Studio is the key window</div>
<div aria-label="Menu bar while Video Studio is key" style="height:24px;border-radius:7px;background:{{bar.bg}};display:flex;align-items:center;padding:0 6px;font-size:13px;color:{{bar.fg}};gap:2px;align-self:flex-start">
<sc-for list="{{vsBar}}" as="b" hint-placeholder-count="6"><span style="height:20px;padding:0 6px;font-size:12px;border-radius:5px;display:flex;align-items:center;font-weight:{{b.fw}};background:{{b.bg}};color:{{b.fg}}">{{b.l}}</span></sc-for>
</div>
<sc-for list="{{vsNotes}}" as="n" hint-placeholder-count="4"><div style="font-size:12px;line-height:16px;color:{{wall.text}};text-shadow:{{wall.shadow}}">{{n}}</div></sc-for>
</div>
</div>
</x-dc>
