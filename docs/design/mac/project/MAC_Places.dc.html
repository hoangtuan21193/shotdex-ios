  const m = dark ? {water:'#1F3A52', land:'#2A2C2E', park:'#26402E', road:'#45474B', major:'#7A6631', label:'rgba(255,255,255,0.78)', waterLabel:'#8FB7D9', halo:'0 0 3px rgba(0,0,0,0.8)'}
                 : {water:'#A9CBE6', land:'#F1EEE6', park:'#CFE3C2', road:'#FFFFFF', major:'#F4D58A', label:'rgba(0,0,0,0.72)', waterLabel:'#3E6E99', halo:'0 0 3px rgba(255,255,255,0.9)'};
  const lab=(name,x,y,o)=>Object.assign({name,x:x+'px',y:y+'px',size:'12px',weight:'600',style:'normal',color:m.label},o||{});
  const labels=[lab('Kyoto',846,312),lab('Osaka',590,664),lab('Nara',1074,606),lab('Kobe',300,658),lab('Uji',996,446),lab('Arashiyama',716,262,{size:'11px',weight:'500'}),
    lab('Lake Biwa',1090,120,{style:'italic',weight:'500',color:m.waterLabel}),lab('Osaka Bay',392,674,{style:'italic',weight:'500',color:m.waterLabel})];
  const cl=(name,count,x,y,k,o)=>Object.assign({label:name+', '+count+' photos',count,x:x+'px',y:y+'px',size:'46px',bg:tile(k),ring:'transparent',ringW:'2px',badgeBg:'rgba(0,0,0,0.72)',badgeFg:'#FFFFFF'},o||{});
  const clusters=[cl('Kyoto','1,284',858,236,0),cl('Arashiyama','342',752,196,3),cl('Fushimi Inari','211',884,340,5),cl('Uji','58',946,394,6),
    cl('Osaka','487',618,596,8),cl('Kobe','36',316,598,2),cl('Lake Biwa','23',1110,214,1),
    cl('Nara Park','112',1036,520,9,{size:'58px',ring:t.accent,ringW:'5px',badgeBg:t.accentFill,badgeFg:t.onAccentFill,label:'Nara Park, 112 photos, selected'})];
  const tray=[]; for(let i=0;i<30;i++) tray.push({bg:tile(i*5+3), label:'Photo '+(i+1)+' of 112'});
  const infoRows=[{k:'Dates',v:'Sep 27 – 28, 2026'},{k:'Cameras',v:'Sony A7 IV, iPhone 17 Pro'},{k:'Sources',v:'T7 RAW Archive and 1 more'}];
  return { m, labels, clusters, tray, infoRows };
}

function sidebarGroups(t, sel){
  const row=(name,d,count,o)=>{o=o||{};const s=name===sel;return {name,d,count:count||'',eject:!!o.eject,chev:!!o.chev,indent:o.indent||'8px',
    bg:s?t.rowSel:'transparent', iconColor:s?t.accent:(o.dim?t.label3:t.accent), textColor:o.dim?t.label2:t.label};};
  return [
    {hasTitle:false, rows:[row('All Photos',I.all,'55,231'),row('Favorites',I.fav,'1,862'),row('Videos',I.video,'1,204'),row('RAW',I.raw,'31,540'),row('Recently Added',I.recent)]},
    {hasTitle:true, title:'Sources', addable:true, addLabel:'Add Source', rows:[row('Photos Library',I.library,'23,904'),row('2026 Japan',I.folder,'4,118'),row('T7 RAW Archive',I.drive,'26,107',{eject:true}),row('NAS Home',I.server,'1,102')]},
    {hasTitle:true, title:'Collections', addable:true, addLabel:'New Album', rows:[row('On This Day',I.otd),row('Albums',I.album,'38',{chev:true}),row('Night ISO 3200+',I.smart,'2,411'),row('85mm Portraits',I.smart,'986')]},
    {hasTitle:true, title:'Utilities', addable:false, rows:[row('Statistics',I.stats),row('Places',I.places),row('Trips',I.trips,'12'),row('Duplicates',I.dup,'53'),row('Collages',I.collage,'12'),row('Video Projects',I.film,'7'),row('Movies',I.movies,'128'),row('On Server',I.onserver,'712')]}
  ];
}

class Component extends DCLogic {
  renderVals() {
    const dark=!!this.props.dark; const t = dark ? DARK : LIGHT;
    return Object.assign({ t, groups: sidebarGroups(t, SEL), edge: dark?'rgba(28,28,30,0.85)':'rgba(255,255,255,0.85)', edgeClear: dark?'rgba(28,28,30,0)':'rgba(255,255,255,0)' }, vals(t, dark));
  }
}
</script>
