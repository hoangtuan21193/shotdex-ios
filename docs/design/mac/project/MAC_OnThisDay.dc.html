</div>

<span style="font-size:11px;color:{{t.label2}};font-variant-numeric:tabular-nums">{{r.count}}</span>
</div>
</sc-for>
</div>
</sc-for>
</div>
<!-- Index status, idle -->
<div style="position:absolute;left:16px;right:16px;bottom:12px;height:20px;display:flex;align-items:center;gap:6px;font-size:11px;color:{{t.label2}};white-space:nowrap">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 3a9 9 0 1 0 0.01 0z M8 12.5l2.8 2.8L16 10"></path></svg><span>Up to date · indexed 2 min ago</span>

  renderVals() {
    const dark=!!this.props.dark; const empty=!!this.props.empty; const t = dark ? DARK : LIGHT;
    return Object.assign({ t, empty, groups: sidebarGroups(t, SEL), edge: dark?'rgba(28,28,30,0.85)':'rgba(255,255,255,0.85)', edgeClear: dark?'rgba(28,28,30,0)':'rgba(255,255,255,0)' }, vals(t, dark, empty));
  }
}
</script>
