<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mac · Viewer Full Screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font-family:inherit;padding:0;margin:0;cursor:default}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; border-radius: 0; background: #000000; color: {{h.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 13px">

<!-- PHOTO at 100%: the screen shows a 1440×900 window into a 4000×2667 frame -->
<div role="img" aria-label="Photo at 100%, DSC04512.ARW" style="position:absolute;left:-1500px;top:-1150px;width:4000px;height:2667px;overflow:hidden">
<div style="position:absolute;inset:0;background:linear-gradient(180deg,#355C7D 0%,#8C7A93 38%,#E2A37A 60%,#F2C99A 66%)"></div>
<div style="position:absolute;left:2652px;top:902px;width:212px;height:212px;border-radius:106px;background:#FBE3B8;opacity:0.9"></div>
<div style="position:absolute;inset:0;background:#4D4A5A;clip-path:polygon(0% 62%,12% 52%,24% 58%,38% 44%,50% 54%,63% 47%,78% 57%,90% 50%,100% 56%,100% 100%,0% 100%)"></div>
<div style="position:absolute;inset:0;background:#2F3A36;clip-path:polygon(0% 72%,16% 66%,30% 73%,47% 63%,62% 71%,80% 64%,100% 70%,100% 100%,0% 100%)"></div>
<div style="position:absolute;inset:0;background:#2F3A36;clip-path:polygon(42% 66.5%,42.6% 63.2%,43.2% 66.4%,43.6% 64.4%,44.1% 66.2%,44.8% 62.6%,45.4% 65.6%,45.9% 63.6%,46.5% 65%,47% 63%,47.6% 64.4%,48.2% 61.8%,48.8% 64.6%,49.4% 63.2%,50% 65.8%,50.6% 62.4%,51.2% 66%,51.8% 64.2%,52.4% 66.8%,53% 63.6%,53.6% 67.2%,54.2% 65%,54.8% 68%,55.4% 64.8%,56% 68.6%,56.6% 66.2%,57.2% 69.4%,57.8% 66.6%,58.4% 70%,59% 67.6%,59.6% 70.6%,60.2% 68.4%,60.8% 71%,60.8% 74%,42% 74%)"></div>
<div style="position:absolute;inset:0;background:#1C2420;clip-path:polygon(0% 84%,20% 80%,42% 86%,64% 79%,84% 84%,100% 80%,100% 100%,0% 100%)"></div>
</div>

<!-- LOUPE NAVIGATOR (top-right, only while zoomed): clear glass + 35% dark dim, HUD style over media -->
<div aria-label="Navigator" style="position:absolute;right:24px;top:24px;width:216px;border-radius:14px;background:{{h.bg}};border:1px solid {{h.stroke}};box-shadow:{{h.shadow}};backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);padding:8px;box-sizing:border-box">
<div style="position:relative;width:200px;height:133px;border-radius:6px;overflow:hidden">
<div style="position:absolute;inset:0;background:linear-gradient(180deg,#355C7D 0%,#8C7A93 38%,#E2A37A 60%,#F2C99A 66%)"></div>
<div style="position:absolute;left:133px;top:45px;width:11px;height:11px;border-radius:6px;background:#FBE3B8"></div>
<div style="position:absolute;inset:0;background:#4D4A5A;clip-path:polygon(0% 62%,12% 52%,24% 58%,38% 44%,50% 54%,63% 47%,78% 57%,90% 50%,100% 56%,100% 100%,0% 100%)"></div>
<div style="position:absolute;inset:0;background:#2F3A36;clip-path:polygon(0% 72%,16% 66%,30% 73%,47% 63%,62% 71%,80% 64%,100% 70%,100% 100%,0% 100%)"></div>
<div style="position:absolute;inset:0;background:#1C2420;clip-path:polygon(0% 84%,20% 80%,42% 86%,64% 79%,84% 84%,100% 80%,100% 100%,0% 100%)"></div>
<div style="position:absolute;inset:0;background:rgba(0,0,0,0.35);clip-path:polygon(0% 0%,100% 0%,100% 100%,0% 100%,0% 0%,37.5% 43.1%,37.5% 76.9%,73.5% 76.9%,73.5% 43.1%,37.5% 43.1%)"></div>
<div style="position:absolute;left:75px;top:57px;width:72px;height:45px;box-sizing:border-box;border:1.5px solid #FFFFFF;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,0.35)"></div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;height:22px;margin-top:4px;padding:0 2px;font-size:11px;color:{{h.text2}};font-variant-numeric:tabular-nums"><span>Zoom</span><span style="color:{{h.text}};font-weight:600">100%</span></div>
</div>

<!-- HUD (appears on pointer movement, hides after 2 s still). Exit = Esc or ⌃⌘F; menu bar and toolbar reveal at the top edge -->
<div style="position:absolute;left:50%;bottom:72px;transform:translateX(-50%);height:44px;border-radius:22px;background:{{h.bg}};border:1px solid {{h.stroke}};box-shadow:{{h.shadow}};backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);display:flex;align-items:center;padding:0 6px;gap:4px;white-space:nowrap">
<button aria-label="Previous Photo" title="Previous (←)" style="width:36px;height:32px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:{{h.text}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div style="display:flex;flex-direction:column;align-items:center;padding:0 6px;min-width:112px"><span style="font-size:12px;font-weight:600;line-height:15px">DSC04512.ARW</span><span style="font-size:11px;color:{{h.text2}};line-height:13px;font-variant-numeric:tabular-nums">12 of 112</span></div>
<button aria-label="Next Photo" title="Next (→)" style="width:36px;height:32px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:{{h.text}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
<div style="width:1px;height:20px;background:{{h.sep}};margin:0 4px"></div>
<button aria-label="Zoom Out" title="Zoom Out (⌘−)" style="width:32px;height:32px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:{{h.text}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.5 4a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13z M15.5 15.5L20.5 20.5 M7.5 10.5h6"></path></svg></button>
<button aria-label="Zoom Level" title="Zoom (Z toggles Fit and 100%)" style="height:28px;padding:0 8px;border-radius:8px;border:none;background:{{h.fill}};color:{{h.text}};font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px">100%<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5-5 5 5 M7 15l5 5 5-5"></path></svg></button>
<button aria-label="Zoom In" title="Zoom In (⌘+)" style="width:32px;height:32px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:{{h.text}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.5 4a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13z M15.5 15.5L20.5 20.5 M7.5 10.5h6 M10.5 7.5v6"></path></svg></button>
<div style="width:1px;height:20px;background:{{h.sep}};margin:0 4px"></div>
<sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
<button aria-label="{{s.label}}" title="{{s.tip}}" style="width:22px;height:32px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:{{s.color}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="{{s.fill}}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"></path></svg></button>
</sc-for>
<div style="width:1px;height:20px;background:{{h.sep}};margin:0 4px"></div>
<button aria-label="Show Inspector" title="Show Inspector (⌥⌘I)" style="width:36px;height:32px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:{{h.text}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z M15 5v14"></path></svg></button>
</div>

<!-- Pointer, to show the HUD is pointer-driven -->
<svg width="18" height="26" viewBox="0 0 18 26" style="position:absolute;left:868px;top:752px" aria-hidden="true"><path d="M1.5 1.5v20l5.2-5 3.4 7.6 3.2-1.4-3.4-7.4h7.1z" fill="#000000" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"></path></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
const LIGHT = { content:'#FFFFFF', label:'rgba(0,0,0,0.88)', label2:'rgba(0,0,0,0.56)', label3:'rgba(0,0,0,0.28)',
  sep:'rgba(0,0,0,0.10)', fill:'rgba(0,0,0,0.05)', fill2:'#F2F2F4', pressed:'rgba(0,0,0,0.09)', track:'rgba(0,0,0,0.10)',
  glass:'rgba(255,255,255,0.72)', glassStroke:'rgba(0,0,0,0.08)', glassShadow:'0 2px 10px rgba(0,0,0,0.10)',
  sidebar:'rgba(244,244,247,0.86)', sidebarShadow:'0 8px 28px rgba(0,0,0,0.12)', rowSel:'rgba(0,0,0,0.08)',
  accent:'#C6730E', onAccent:'#FFFFFF', red:'#FF3B30', green:'#34C759' };
const DARK = { content:'#1C1C1E', label:'rgba(255,255,255,0.90)', label2:'rgba(255,255,255,0.58)', label3:'rgba(255,255,255,0.28)',
  sep:'rgba(255,255,255,0.10)', fill:'rgba(255,255,255,0.07)', fill2:'#2C2C2E', pressed:'rgba(255,255,255,0.12)', track:'rgba(255,255,255,0.14)',
  glass:'rgba(50,50,54,0.72)', glassStroke:'rgba(255,255,255,0.10)', glassShadow:'0 2px 12px rgba(0,0,0,0.45)',
  sidebar:'rgba(38,38,42,0.86)', sidebarShadow:'0 8px 28px rgba(0,0,0,0.5)', rowSel:'rgba(255,255,255,0.10)',
  accent:'#EB9526', onAccent:'#000000', red:'#FF453A', green:'#30D158' };
class Component extends DCLogic {
  renderVals() {
    const dark=!!this.props.dark; const t = dark ? DARK : LIGHT;
    const stars=[1,2,3,4,5].map(n=>({ label: n===1?'Rate 1 Star':'Rate '+n+' Stars', tip: (n===1?'1 star':n+' stars')+' ('+n+')',
      fill: n<=4?'currentColor':'none', color: n<=4?t.label:t.label2 }));
    // Full screen is media: HUD material is dark in both appearances (clear glass + 35% dim)
    const h = { bg:'rgba(28,28,30,0.62)', stroke:'rgba(255,255,255,0.12)', shadow:'0 4px 18px rgba(0,0,0,0.45)',
      text:'rgba(255,255,255,0.92)', text2:'rgba(255,255,255,0.62)', sep:'rgba(255,255,255,0.16)', fill:'rgba(255,255,255,0.12)' };
    const hs=[1,2,3,4,5].map(n=>({ label: n===1?'Rate 1 Star':'Rate '+n+' Stars', tip: (n===1?'1 Star':n+' Stars')+' ('+n+')',
      fill: n<=4?'currentColor':'none', color: n<=4?h.text:h.text2 }));
    return { t, h, stars: hs };
  }
}
</script>
</body>
</html>
