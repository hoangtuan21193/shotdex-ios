<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
const LIGHT = { bg:'#FFFFFF', grouped:'#F2F2F7', card:'#FFFFFF', label:'#000000', label2:'#6C6C70', label3:'#8E8E93',
  sep:'#C6C6C8', fill:'#E9E9EB', fill2:'#F2F2F7', glass:'rgba(255,255,255,0.78)', glassStroke:'rgba(0,0,0,0.08)',
  glassShadow:'0 4px 18px rgba(0,0,0,0.12)', tint:'#007AFF', red:'#FF3B30', green:'#34C759', orange:'#FF9500',
  accent:'#C6730E', dim:'rgba(0,0,0,0.35)', sheet:'#FFFFFF', onAccent:'#FFFFFF' };
const DARK = { bg:'#000000', grouped:'#000000', card:'#1C1C1E', label:'#FFFFFF', label2:'#98989F', label3:'#6C6C70',
  sep:'#38383A', fill:'#2C2C2E', fill2:'#1C1C1E', glass:'rgba(44,44,46,0.78)', glassStroke:'rgba(255,255,255,0.10)',
  glassShadow:'0 4px 18px rgba(0,0,0,0.5)', tint:'#0A84FF', red:'#FF453A', green:'#30D158', orange:'#FF9F0A',
  accent:'#EB9526', dim:'rgba(0,0,0,0.55)', sheet:'#1C1C1E', onAccent:'#000000' };
// Large-group card: the Keep photo spans K×K cells of a C-column grid (each side > 2× a delete tile),
// the deletes fill the cells to its right, then full rows below; a short last row stretches to the card
// width. Pick the C/K with the biggest delete tiles that leaves no empty cell and keeps the 2× rule.
const GAP = 4;
function layoutGroup(n, left, top, width) {
  let best = null;
  for (const C of [4, 5, 6]) for (let K = C - 1; K >= 2; K--) {
    const u = (width - GAP * (C - 1)) / C, S = K * u + (K - 1) * GAP, cells = [];
    const side = Math.min(n, (C - K) * K), rc = C - K;
    const rRows = Math.ceil(side / rc);
    if (side && rRows < K) continue;                       // right of the Keep must be full height
    for (let i = 0; i < side; i++) {
      const r = Math.floor(i / rc), inRow = Math.min(rc, side - r * rc);
      const w = (rc * u + (rc - 1) * GAP - GAP * (inRow - 1)) / inRow, c = i - r * rc;
      cells.push({ x: left + S + GAP + c * (w + GAP), y: top + r * (u + GAP), w, h: u });
    }
    for (let i = side; i < n; i++) {
      const j = i - side, r = Math.floor(j / C), inRow = Math.min(C, n - side - r * C), c = j - r * C;
      const w = (width - GAP * (inRow - 1)) / inRow;
      cells.push({ x: left + c * (w + GAP), y: top + S + GAP + r * (u + GAP), w, h: u });
    }
    if (!cells.every(q => q.w * 2 < S && q.h * 2 < S)) continue;
    const h = cells.reduce((m, q) => Math.max(m, q.y + q.h), top + S) - top;
    if (!best || u > best.u || (u === best.u && S > best.S)) best = { u, S, cells, h };
  }
  return best;
}
const BG = ['linear-gradient(180deg,#6B4E3D 0%,#E2B07A 52%,#2F3B2F 52%,#1E271E 100%)',
  'linear-gradient(180deg,#355C7D 0%,#C06C84 56%,#2F3B2F 56%,#1E271E 100%)',
  'linear-gradient(180deg,#2B5876 0%,#4E4376 60%,#2F3B2F 60%,#1E271E 100%)',
  'linear-gradient(180deg,#A3B18A 0%,#344E41 54%,#2F3B2F 54%,#1E271E 100%)',
  'linear-gradient(180deg,#2E4A6B 0%,#9FB8C9 52%,#2F3B2F 52%,#1E271E 100%)',
  'linear-gradient(180deg,#7A5C8E 0%,#F2A774 56%,#2F3B2F 56%,#1E271E 100%)',
  'linear-gradient(180deg,#3D6B5A 0%,#C9D6A3 52%,#2F3B2F 52%,#1E271E 100%)',
  'linear-gradient(180deg,#8AA9C1 0%,#F4E1C1 55%,#2F3B2F 55%,#1E271E 100%)'];
const GROUPS = [
  { n: '8 photos', free: '~31.9 MB to free', d: 'Sep 9, 2026 · 6 s apart', mark: 'Unmark', marked: true, date: 'Sep 9, 2026',
    keep: { px: '6240×4160', mb: '18.9 MB', c1: 'Edited', c2: 'RAW', extra: 'edited, RAW',
      bg: 'linear-gradient(180deg,#4F6D7A 0%,#DDE2C6 56%,#2F3B2F 56%,#1E271E 100%)' },
    dels: [['6240×4160', '17.2 MB'], ['6240×4160', '4.4 MB'], ['6240×4160', '4.1 MB'], ['3120×2080', '2.2 MB', 1],
      ['3120×2080', '2.0 MB'], ['1920×1280', '1.1 MB', 1], ['1920×1280', '0.9 MB']] },
  { n: '4 photos', free: '~31.8 MB to free', d: 'Sep 14, 2026 · 2 s apart', mark: 'Mark the other 3', marked: false, date: 'Sep 14, 2026',
    keep: { px: '6000×4000', mb: '24.6 MB', c1: 'Edited', c2: 'Favorite', extra: 'favorite, edited',
      bg: 'linear-gradient(180deg,#5B7FA6 0%,#E8C39E 56%,#2F3B2F 56%,#1E271E 100%)' },
    dels: [['6000×4000', '23.1 MB'], ['6000×4000', '5.9 MB'], ['3000×2000', '2.8 MB']] }
];
const words = px => px.replace('×', ' by ') + ' pixels';
function build() {
  const cards = [], keepers = [], tiles = [];
  let y = 212;
  GROUPS.forEach((g, gi) => {
    const L = layoutGroup(g.dels.length, 28, y + 58, 346);
    const fy = 58 + L.h + 8, count = g.dels.length + 1;
    cards.push({ x: 16, y, w: 370, h: fy + 52, fy, n: g.n, free: g.free, d: g.d, mark: g.mark, marked: g.marked,
      markAria: g.marked ? 'Unmark photos in this group' : 'Mark the other ' + g.dels.length + ' photos for deletion',
      keepAria: 'Keep all ' + count + ' photos from ' + g.date, cmpAria: 'Compare ' + count + ' photos from ' + g.date });
    const k = g.keep;
    keepers.push({ x: 28, y: y + 58, s: L.S, bg: k.bg, facts: k.px + ' · ' + k.mb, c1: k.c1, c1d: k.c1 ? 'block' : 'none',
      c2: k.c2, c2d: k.c2 ? 'block' : 'none', aria: 'Suggested keep: ' + words(k.px) + ', ' + k.mb + ', ' + k.extra + ', not marked' });
    g.dels.forEach((p, i) => {
      const q = L.cells[i], on = !!p[2];
      tiles.push({ x: q.x, y: q.y, w: q.w, h: q.h, bg: BG[(i + gi * 3) % BG.length], op: on ? '0.45' : '1',
        mark: on ? 'block' : 'none', off: on ? 'none' : 'block', px: p[0], mb: p[1],
        aria: words(p[0]) + ', ' + p[1] + (on ? ', marked for deletion' : ', not marked') });
    });
    y += fy + 52 + 12;
  });
  return { cards, keepers, tiles };
}
const B = build();
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const t = dark ? DARK : LIGHT;
    return {
      t,
      seg: dark ? '#636366' : '#FFFFFF',
      hdr: dark ? 'rgba(22,22,24,0.72)' : 'rgba(248,248,250,0.72)',
      fadeOn: dark ? 'rgba(0,0,0,0.78)' : 'rgba(242,242,247,0.78)',
      fadeOff: dark ? 'rgba(0,0,0,0)' : 'rgba(242,242,247,0)',
      cards: B.cards.map(c => Object.assign({}, c, { markColor: c.marked ? t.label : t.red })),
      keepers: B.keepers,
      tiles: B.tiles
    };
  }
}
</script>
