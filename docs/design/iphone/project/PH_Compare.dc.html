<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone · Viewer · Compare</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font-family:inherit;padding:0;margin:0;cursor:default}
</style>
</helmet>
<div style="width: 402px; height: 874px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.label}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif">
<!-- COMPARE: the Viewer in Compare mode (not tier D: follows light/dark like the Viewer). On a 402pt phone 2-Up is STACKED:
     Select on top, Candidate below, both on screen at once at the same zoom (pinch either, both follow; always synced).
     Swipe the Candidate pane sideways for the next candidate; the Select pane stays put. Each pane: photo, one EXIF line,
     the Cull row [Reject] [5 stars] [Pick]. Reject marks for deletion; Delete N (bottom right, where the Viewer keeps Delete)
     removes the rejected ones. Its label follows where the rejected copies go (08c §5, FS-19.04 §2):
     Photos only, or a drive with no Trash only → Delete N Photos; any file that goes to Recently Deleted in Files (even mixed)
     → Move N Photos…; NAS only → Hide N Photos (eye glyph, never the word delete). Here the candidate is a file in the
     "2026 Japan" folder (On My iPhone), so the button reads Move 1 Photo…; tweak candidateOnNAS shows the Hide case. Touch and hold a pane: Make Select, Share, Remove from
     Comparison, Keep Only This. No Survey on phone: Single and Compare only. -->
<sc-for list="{{panes}}" as="p" hint-placeholder-count="2">
<section aria-label="{{p.label}}" style="position:absolute;left:16px;top:{{p.y}};width:370px;height:294px">
<div role="img" aria-label="{{p.imgLabel}}" style="position:absolute;left:0;top:0;width:370px;height:226px;border-radius:12px;overflow:hidden;background:{{t.fill2}}"><div style="position:absolute;left:{{p.ox}};top:{{p.oy}};width:{{p.sw}};height:{{p.sh}}"><div style="position:absolute;inset:0;background:{{p.sky}}"></div><div style="position:absolute;left:{{p.sunX}};top:{{p.sunY}};width:{{p.sun}};height:{{p.sun}};border-radius:50%;background:#FBE3B8;opacity:0.9"></div><div style="position:absolute;inset:0;background:#4D4A5A;clip-path:polygon(0% 62%,12% 52%,24% 58%,38% 44%,50% 54%,63% 47%,78% 57%,90% 50%,100% 56%,100% 100%,0% 100%)"></div><div style="position:absolute;inset:0;background:#2F3A36;clip-path:polygon(0% 72%,16% 66%,30% 73%,47% 63%,62% 71%,80% 64%,100% 70%,100% 100%,0% 100%)"></div><div style="position:absolute;inset:0;background:#1C2420;clip-path:polygon(0% 84%,20% 80%,42% 86%,64% 79%,84% 84%,100% 80%,100% 100%,0% 100%)"></div></div>
<div style="position:absolute;left:10px;top:10px;display:flex;gap:6px"><span style="height:26px;padding:0 10px;border-radius:13px;background:{{p.roleBg}};color:{{p.roleFg}};font-size:13px;font-weight:600;line-height:26px;white-space:nowrap">{{p.role}}</span><sc-if value="{{p.picked}}" hint-placeholder-val="{{false}}"><span style="height:26px;padding:0 10px 0 8px;border-radius:13px;background:rgba(0,0,0,0.58);color:#FFFFFF;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4 M5 4h11l-2 4 2 4H5z"></path></svg>Picked</span></sc-if><sc-if value="{{p.rejected}}" hint-placeholder-val="{{false}}"><span style="height:26px;padding:0 10px 0 8px;border-radius:13px;background:{{t.redFill}};color:#FFFFFF;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg>Rejected</span></sc-if></div>
<sc-if value="{{p.loading}}" hint-placeholder-val="{{false}}"><div role="img" aria-label="Loading full resolution, 40 percent" style="position:absolute;right:10px;top:12px;width:22px;height:22px"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" style="display:block"><circle cx="11" cy="11" r="11" fill="rgba(0,0,0,0.45)"></circle><circle cx="11" cy="11" r="8.5" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="2"></circle><circle cx="11" cy="11" r="8.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="21 54" transform="rotate(-90 11 11)"></circle><path d="M8.4 14h5.4a1.9 1.9 0 0 0 .2-3.8 2.7 2.7 0 0 0-5.2-.6A2.2 2.2 0 0 0 8.4 14z" fill="#FFFFFF"></path></svg></div></sc-if>
<span aria-label="{{p.zoomLabel}}" style="position:absolute;right:10px;bottom:10px;height:24px;padding:0 9px 0 8px;border-radius:12px;background:rgba(0,0,0,0.58);color:#FFFFFF;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>{{p.zoom}}</span>
</div>
<sc-if value="{{p.focus}}" hint-placeholder-val="{{false}}"><div aria-hidden="true" style="position:absolute;left:-4px;top:-4px;width:378px;height:234px;border:2px solid {{t.accent}};border-radius:15px;box-sizing:border-box"></div></sc-if>
<div style="position:absolute;left:2px;top:226px;width:366px;height:24px;display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;white-space:nowrap;font-variant-numeric:tabular-nums"><span style="font-weight:600;flex:none">{{p.name}}</span><span style="color:{{t.label2}};min-width:0;overflow:hidden;text-overflow:ellipsis">{{p.exif}}</span></div>
<div role="toolbar" aria-label="{{p.rowLabel}}" style="position:absolute;left:15px;top:250px;width:340px;height:44px;display:flex;align-items:center;gap:16px">
<button aria-label="Reject" aria-pressed="{{p.rejOn}}" style="width:44px;height:44px;border-radius:22px;border:none;background:{{p.rejBg}};color:{{p.rejFg}};display:flex;align-items:center;justify-content:center;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="display:block"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button>
<div role="radiogroup" aria-label="{{p.rateLabel}}" style="display:flex;width:220px;flex:none"><sc-for list="{{p.stars}}" as="s" hint-placeholder-count="5"><button role="radio" aria-checked="{{s.on}}" aria-label="{{s.label}}" style="width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="display:block"><polygon points="12 3 14.8 9 21 9.6 16.2 13.8 17.6 20 12 16.8 6.4 20 7.8 13.8 3 9.6 9.2 9" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.6" stroke-linejoin="round"></polygon></svg></button></sc-for></div>
<button aria-label="Pick" aria-pressed="{{p.pickOn}}" style="width:44px;height:44px;border-radius:22px;border:none;background:{{p.pickBg}};color:{{p.pickFg}};display:flex;align-items:center;justify-content:center;flex:none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5" fill="currentColor"></path></svg></button>
</div>
</section>
</sc-for>
<!-- TOP: Close (as in the Viewer) · what is being compared · Viewer mode [Single · Compare] -->
<button aria-label="Close" style="position:absolute;left:16px;top:70px;width:52px;height:52px;border-radius:26px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-sizing:border-box;color:{{t.label}};display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg></button>
<div style="position:absolute;left:80px;top:70px;width:116px;height:52px;display:flex;flex-direction:column;justify-content:center;gap:1px"><span style="font-size:15px;font-weight:600;line-height:20px;white-space:nowrap">{{title}}</span><span style="font-size:12px;line-height:16px;color:{{t.label2}};white-space:nowrap;font-variant-numeric:tabular-nums">{{subtitle}}</span></div>
<div role="radiogroup" aria-label="Viewer Mode" style="position:absolute;right:16px;top:70px;height:52px;border-radius:26px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-sizing:border-box;padding:0 3px;display:flex;align-items:center;gap:2px"><sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button role="radio" aria-checked="{{m.on}}" style="height:44px;padding:0 16px;border-radius:22px;border:none;background:{{m.bg}};color:{{m.fg}};font-size:15px;font-weight:{{m.fw}};white-space:nowrap">{{m.name}}</button></sc-for></div>
<!-- Long-press hint (FS-01.08 K5), in the corner of the Delete button; shown while anything is rejected -->
<div style="position:absolute;right:20px;top:746px;height:16px;font-size:12px;line-height:16px;color:{{t.label2}};white-space:nowrap">Touch and hold to keep only this one</div>
<!-- BOTTOM, the Viewer's bar: Share · [Make Select | More] · Delete N (glass, red text: destructive but not prominent) -->
<button aria-label="Share" style="position:absolute;left:20px;top:776px;width:52px;height:52px;border-radius:26px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-sizing:border-box;color:{{t.label}};display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M12 3.5v11M8.2 7.2L12 3.5l3.8 3.7"></path><path d="M8.5 10H6.8A1.8 1.8 0 0 0 5 11.8v7.4A1.8 1.8 0 0 0 6.8 21h10.4a1.8 1.8 0 0 0 1.8-1.8v-7.4A1.8 1.8 0 0 0 17.2 10h-1.7"></path></svg></button>
<div style="position:absolute;left:88px;top:778px;height:48px;border-radius:24px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-sizing:border-box;padding:0 4px;display:flex;align-items:center;gap:4px"><button aria-label="Make Select" style="width:64px;height:44px;border:none;background:none;color:{{t.label}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M7 7h12 M16 4l3 3-3 3 M17 17H5 M8 14l-3 3 3 3"></path></svg><span style="font-size:10px;font-weight:600;line-height:12px;white-space:nowrap">Make Select</span></button><button aria-label="More actions" style="width:44px;height:40px;border:none;background:none;color:{{t.label}};display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="display:block"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg></button></div>
<button aria-label="{{deleteLabel}}" style="position:absolute;right:20px;top:776px;height:52px;border-radius:26px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-sizing:border-box;padding:0 14px;color:{{t.redText}};display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="{{deleteGlyph}}"></path></svg>{{deleteLabel}}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"candidateOnNAS":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
// iPhone · Viewer in Compare mode. Compare is a mode of the Viewer (Single · Compare on phone), not tier D:
// it follows light/dark like the Viewer (user decision 2026-10-04). Tokens: iPhone Library board (Main.dc.html) verbatim.
// Reference: docs/design/ipad/project/IP_Compare.dc.html (2-Up side by side). Phone keeps its own language:
// 52pt floating glass circles, bottom bar, the Cull row [Reject] [stars] [Pick] from PH23_Cull.
const LIGHT = { bg:'#FFFFFF', grouped:'#F2F2F7', card:'#FFFFFF', label:'#000000', label2:'#6C6C70', label3:'#8E8E93',
  sep:'#C6C6C8', fill:'#E9E9EB', fill2:'#F2F2F7', glass:'rgba(255,255,255,0.78)', glassStroke:'rgba(0,0,0,0.08)',
  glassShadow:'0 4px 18px rgba(0,0,0,0.12)', tint:'#C6730E', red:'#FF3B30', green:'#34C759', orange:'#FF9500',
  accent:'#C6730E', dim:'rgba(0,0,0,0.35)', sheet:'#FFFFFF', onAccent:'#FFFFFF' };
const DARK = { bg:'#000000', grouped:'#000000', card:'#1C1C1E', label:'#FFFFFF', label2:'#98989F', label3:'#6C6C70',
  sep:'#38383A', fill:'#2C2C2E', fill2:'#1C1C1E', glass:'rgba(44,44,46,0.78)', glassStroke:'rgba(255,255,255,0.10)',
  glassShadow:'0 4px 18px rgba(0,0,0,0.5)', tint:'#EB9526', red:'#FF453A', green:'#30D158', orange:'#FF9F0A',
  accent:'#EB9526', dim:'rgba(0,0,0,0.55)', sheet:'#1C1C1E', onAccent:'#000000' };
// Board-local, same values as IP_Compare: text on an accent or red fill and red text on glass need 4.5:1 in both appearances.
const EXTRA_LIGHT = { accentFill:'#A35E0A', onAccentFill:'#FFFFFF', redFill:'#D70015', redText:'#C4001A', pressed:'rgba(0,0,0,0.08)' };
const EXTRA_DARK = { accentFill:'#EB9526', onAccentFill:'#000000', redFill:'#D70015', redText:'#FF6961', pressed:'rgba(255,255,255,0.18)' };
const SUN=[ ['#355C7D','#8C7A93','#E2A37A','#F2C99A'], ['#3E6688','#978399','#E9AD84','#F5D3A6'], ['#2F5372','#86728E','#DE9A72','#EFC292'],
  ['#46708F','#9E8A9E','#EDB58C','#F7DAB0'], ['#2A4A66','#7E6C88','#D8916A','#EBB98A'], ['#3A6080','#93809A','#E6A87F','#F3CF9F'] ];
const sky=(i)=>{const s=SUN[i%SUN.length];return 'linear-gradient(180deg,'+s[0]+' 0%,'+s[1]+' 38%,'+s[2]+' 60%,'+s[3]+' 66%)';};
// A zoomed viewport onto a 3:2 landscape: the scene is k times the pane width, (dx,dy) is where the sun sits in the pane.
function scene(w, k, dx, dy){
  const sw=Math.round(w*k), sh=Math.round(sw*2/3), sun=Math.round(sw*0.053);
  const cx=Math.round(sw*0.663), cy=Math.round(sh*0.338);
  return { sw:sw+'px', sh:sh+'px', sun:sun+'px', sunX:(cx-sun/2)+'px', sunY:cy+'px', ox:(dx-cx)+'px', oy:(dy-cy)+'px' };
}
// One compared photo. f: '' | 'p' | 'x'; r: stars 0-5.
function photo(t, o){
  const stars=[1,2,3,4,5].map(n=>({ on: n===o.r?'true':'false', label: n+(n===1?' Star':' Stars'),
    fill: n<=o.r?t.label:'none', stroke: n<=o.r?t.label:t.label3 }));
  const words=[o.r?(o.r+(o.r===1?' star':' stars')):'No rating', o.f==='p'?'Picked':(o.f==='x'?'Rejected, marked for deletion':'Unflagged')];
  return Object.assign({ stars, rateLabel:'Rating for '+o.name, rowLabel:'Rating and flag for '+o.name,
    picked:o.f==='p', rejected:o.f==='x', focus:!!o.focus, loading:!!o.loading,
    pickOn:o.f==='p'?'true':'false', pickBg:o.f==='p'?t.accent:t.fill, pickFg:o.f==='p'?'#000000':t.label,
    rejOn:o.f==='x'?'true':'false', rejBg:o.f==='x'?t.red:t.fill, rejFg:o.f==='x'?'#FFFFFF':t.label,
    zoom:'100%', zoomLabel:'Zoom 100 percent, synced',
    imgLabel:'Photo, '+o.name+', '+words.join(', ')+(o.focus?', focused':''), label:o.role+', '+o.name }, o);
}
const TRASH='M4.5 6.8h15M9.6 6.8V4.4h4.8v2.4M6.6 6.8l.9 13.2h9l.9-13.2M10.2 10.6v6M13.8 10.6v6';
const EYE_SLASH='M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z M12 9.2a2.8 2.8 0 1 0 0.01 0 M4 20L20 4';
class Component extends DCLogic {
  renderVals() {
    const dark=!!this.props.dark; const nas=!!this.props.candidateOnNAS; const t=Object.assign({}, dark?DARK:LIGHT, dark?EXTRA_DARK:EXTRA_LIGHT);
    const panes=[
      photo(t, Object.assign(scene(370,2.5,222,50), { y:'134px', sky:sky(0), role:'Select', roleBg:t.accentFill, roleFg:t.onAccentFill, focus:true,
        name:'DSC04512.ARW', exif:'2026 Japan · f/2.8 · 1/250 s · ISO 400', r:4, f:'p' })),
      photo(t, Object.assign(scene(370,2.5,217,47), { y:'440px', sky:sky(1), role:'Candidate 1 of 3', roleBg:'rgba(0,0,0,0.58)', roleFg:'#FFFFFF', loading:true,
        name:'DSC04513.ARW', exif:(nas?'NAS Home':'2026 Japan')+' · f/2.8 · 1/200 s · ISO 400', r:0, f:'x' }))
    ];
    const mode=(name,on)=>({ name, on:on?'true':'false', bg:on?t.pressed:'transparent', fg:on?t.label:t.label2, fw:on?'600':'500' });
    return { t, panes, modes:[mode('Single',false), mode('Compare',true)],
      title:'4 Photos', subtitle:'1 picked · 1 rejected', deleteLabel: nas?'Hide 1 Photo':'Move 1 Photo…', deleteGlyph: nas?EYE_SLASH:TRASH };
  }
}
</script>
</body>
</html>
