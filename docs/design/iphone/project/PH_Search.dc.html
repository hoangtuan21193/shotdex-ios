<div style="position:absolute;left:20px;width:362px;bottom:364px;display:flex;flex-direction:column;gap:8px"><button style="align-self:flex-start;height:44px;padding:0 16px;border-radius:22px;border:none;background:{{t.fill}};color:{{t.label}};font-size:17px;white-space:nowrap">brand Sony · focal 85mm</button></div>
<div style="position:absolute;left:16px;top:518px;width:314px;height:48px;border-radius:24px;background: {{t.glass}}; border: 1px solid {{t.glassStroke}}; box-shadow: {{t.glassShadow}}; backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);display:flex;align-items:center;gap:8px;padding:0 12px 0 14px;box-sizing:border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;color:{{t.label2}}"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L20.5 20.5"></path></svg><input value="Sony 85mm" aria-label="Search your library" style="flex:1;min-width:0;border:none;background:none;outline:none;font-size:17px;color:{{t.label}};padding:0"><button aria-label="Advanced Search" style="width:28px;height:28px;background:none;border:none;display:flex;align-items:center;justify-content:center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block;color:{{t.label}}"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg></button></div>

<div style="position:absolute;left:0px;top:574px;width:402px;height:300px;background:{{t.fill}};border-radius:26px 26px 0 0;padding:10px 4px 0 4px;box-sizing:border-box;display:flex;flex-direction:column;gap:11px"><sc-for list="{{keys}}" as="r" hint-placeholder-count="3"><div style="display:flex;justify-content:center;gap:6px"><sc-for list="{{r.keys}}" as="k" hint-placeholder-count="9"><div style="flex:0 1 34px;height:44px;border-radius:8px;background:{{kbKey}};display:flex;align-items:center;justify-content:center;font-size:22px;color:{{t.label}}">{{k.k}}</div></sc-for></div></sc-for><div style="display:flex;gap:6px;padding:0 2px"><div style="width:96px;height:44px;border-radius:8px;background:{{kbKey2}};display:flex;align-items:center;justify-content:center;font-size:16px">123</div><div style="flex:1;height:44px;border-radius:8px;background:{{kbKey}};display:flex;align-items:center;justify-content:center;font-size:16px">space</div><div style="width:96px;height:44px;border-radius:8px;background:{{t.tint}};color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:16px">search</div></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>

const LIGHT = { bg:'#FFFFFF', grouped:'#F2F2F7', card:'#FFFFFF', label:'#000000', label2:'#6C6C70', label3:'#8E8E93',
  sep:'#C6C6C8', fill:'#E9E9EB', fill2:'#F2F2F7', glass:'rgba(255,255,255,0.78)', glassStroke:'rgba(0,0,0,0.08)',
  glassShadow:'0 4px 18px rgba(0,0,0,0.12)', tint:'#007AFF', red:'#FF3B30', green:'#34C759', orange:'#FF9500',
  accent:'#C6730E', dim:'rgba(0,0,0,0.35)', sheet:'#FFFFFF', onAccent:'#FFFFFF' };
const DARK = { bg:'#000000', grouped:'#000000', card:'#1C1C1E', label:'#FFFFFF', label2:'#98989F', label3:'#6C6C70',
  sep:'#38383A', fill:'#2C2C2E', fill2:'#1C1C1E', glass:'rgba(44,44,46,0.78)', glassStroke:'rgba(255,255,255,0.10)',
  glassShadow:'0 4px 18px rgba(0,0,0,0.5)', tint:'#0A84FF', red:'#FF453A', green:'#30D158', orange:'#FF9F0A',
  accent:'#EB9526', dim:'rgba(0,0,0,0.55)', sheet:'#1C1C1E', onAccent:'#000000' };
const SKIES=[['#5B7FA6','#E8C39E'],['#2E4A6B','#9FB8C9'],['#7A5C8E','#F2A774'],['#3D6B5A','#C9D6A3'],['#8AA9C1','#F4E1C1'],
 ['#1F3A4D','#D98C5F'],['#4F6D7A','#DDE2C6'],['#6B4E3D','#E2B07A'],['#355C7D','#C06C84'],['#2B5876','#4E4376'],['#A3B18A','#344E41'],['#D4A373','#606C38']];
const tile=(i)=>{const s=SKIES[i%SKIES.length];return 'linear-gradient(180deg,'+s[0]+' 0%,'+s[1]+' 58%,#2F3B2F 58%,#1E271E 100%)';};
const META=['ISO 400 · 85mm · f/1.8','ISO 100 · 24mm · f/8','ISO 3200 · 35mm · f/1.4','ISO 200 · 70mm · f/2.8',
 'ISO 800 · 50mm · f/2','ISO 125 · 16mm · f/11','ISO 640 · 135mm · f/1.8','ISO 1600 · 23mm · f/2','ISO 250 · 56mm · f/1.2'];
const FT=['HEIC','RAW','JPG','RAW','HEIC','RAW','JPG','HEIC','RAW'];
const DUR=['0:42','1:08','0:17','2:31'];
function makeTiles(n, o){
  const out=[]; const sel=o.selected||[];
  for(let i=0;i<n;i++){
    const isVideo = (i%11)===4;
    const s = sel.indexOf(i)>=0;
    const fav = !isVideo && (i%7)===2;
    const live = !isVideo && (i%9)===5;
    const hasMeta = !!o.meta && !isVideo;
    out.push({ bg: tile(i*5+3), op: s?0.82:1, ft: isVideo?'MOV':FT[i%FT.length], isVideo, dur: '▶ '+DUR[i%DUR.length],
      hasMeta, meta: META[i%META.length], fav, live, hasStatus: fav||live,
      statusBottom: hasMeta?'20px':'4px', selecting: !!o.selecting, sel: s, unsel: !!o.selecting && !s, acc: o.t.accent });
  }
  return out;
}
const KEYROWS=[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']];
const keyRows=()=>KEYROWS.map(r=>({keys:r.map(k=>({k}))}));
class Component extends DCLogic {
  renderVals() {
    const t = this.props.dark ? DARK : LIGHT;
    return { t, keys: keyRows(), kbKey: this.props.dark ? t.label3 : t.card, kbKey2: this.props.dark ? t.sep : t.sep, rec7: tile(7), rec2: tile(2), rec10: tile(10) };
  }
}
</script>
</body>
