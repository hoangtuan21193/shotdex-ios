<!-- VIEWER ⋯ (FS-02.04 per FS-21.03 §4): the menu of PH28_ViewerMenu plus the two commands the iPad Viewer toolbar/menu
     had and the phone lacked — Rotate Counterclockwise / Rotate Clockwise (next to the other photo commands) and Print…
     (with the output commands). Rotation of a Photos asset is a Photos edit; of a file, it is written to the recipe and
     the .xmp — never into the file (FS-19.02). Opens upward from ⋯; Viewer is light here (follows the system). -->
<div role="menu" aria-label="More actions" style="position:absolute;left:56px;top:{{menuTop}};width:290px;overflow:hidden;border-radius:24px;background:{{t.menu}};border:1px solid {{t.glassStroke}};box-shadow:0 12px 40px rgba(0,0,0,0.22);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);padding:6px 0;box-sizing:border-box">
