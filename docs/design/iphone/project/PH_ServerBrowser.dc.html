<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone · Server folder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font-family:inherit;padding:0;margin:0;cursor:default}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 402px; height: 874px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.label}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif">
<!-- SERVER SOURCE, BROWSED (FS-19.03 §4, §9): NAS Home is an indexed source, listed under Collections › Sources. Tapping it
     opens this Files-style browser (path menu on the title, ‹ ›, ⋯ with Select · Rescan · Upload… · New Folder · Icons/List
     · Sort By). Its photos ARE library photos: same cell, same meta line, same badges, same selection menu as All Photos.
     Gone on every device: Import to Library and the "In Library" tick. Getting a copy into Photos is an EXPORT —
     Save to Photos, here in the selection ⋯ (and in Share). NAS files are never deleted from ShotDex (D6): the bottom-right
     action is Hide, not Delete. State drawn: 2 photos selected, selection ⋯ open. -->
<div style="position:absolute;left:0;top:114px;width:402px;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:2px">
<sc-for list="{{tiles}}" as="p" hint-placeholder-count="18"><div style="position:relative;aspect-ratio:1/1;overflow:hidden;background:{{p.cellBg}}">
<sc-if value="{{p.folder}}" hint-placeholder-val="{{false}}"><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px"><svg viewBox="0 0 24 24" width="40" height="40" style="display:block;color:{{t.tint}}"><path d="M2.5 6.5A1.5 1.5 0 0 1 4 5h5l2 2.5h9A1.5 1.5 0 0 1 21.5 9v9.5A1.5 1.5 0 0 1 20 20H4a1.5 1.5 0 0 1-1.5-1.5z" fill="currentColor"></path></svg><div style="font-size:12px;color:{{t.label}}">{{p.name}}</div></div></sc-if>
<sc-if value="{{p.photo}}" hint-placeholder-val="{{true}}"><div style="position:absolute;inset:0;background:{{p.bg}};opacity:{{p.op}}"></div>
<div style="position:absolute;left:4px;top:4px;height:16px;padding:0 5px;border-radius:4px;background:rgba(0,0,0,0.58);color:#FFFFFF;font-size:9px;font-weight:700;line-height:16px">{{p.ft}}</div>
<div style="position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0.55) 100%)"></div><div style="position:absolute;left:6px;right:28px;bottom:4px;color:#FFFFFF;font-size:10px;font-weight:500;line-height:13px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums">{{p.meta}}</div>
<sc-if value="{{p.rated}}" hint-placeholder-val="{{false}}"><div style="position:absolute;right:5px;top:4px;height:16px;padding:0 5px;border-radius:8px;background:rgba(0,0,0,0.45);color:#FFFFFF;font-size:10px;font-weight:600;line-height:16px">★ {{p.stars}}</div></sc-if>
<sc-if value="{{p.sel}}" hint-placeholder-val="{{false}}"><div style="position:absolute;inset:0;border:3px solid {{t.accent}}"></div><svg width="22" height="22" viewBox="0 0 24 24" style="position:absolute;right:4px;bottom:4px;display:block"><circle cx="12" cy="12" r="11" fill="{{t.accent}}"></circle><path d="M7 12.4l3.3 3.3L17 9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
<sc-if value="{{p.unsel}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" style="position:absolute;right:4px;bottom:4px;display:block"><circle cx="12" cy="12" r="10" fill="rgba(0,0,0,0.12)" stroke="#FFFFFF" stroke-width="1.8"></circle></svg></sc-if>
</sc-if>
</div></sc-for>
</div>

<div style="position:absolute;left:0;bottom:0px;width:402px;height:120px;background:linear-gradient(0deg,{{edgeTop}} 0%,{{edgeClear}} 100%);pointer-events:none"></div>
<div style="position:absolute;left:16px;top:62px;width:96px;height:44px;border-radius:22px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-sizing:border-box;display:flex"><button aria-label="Back" style="flex:1;background:none;border:0;display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M15 5l-7 7 7 7"></path></svg></button><button aria-label="Forward" disabled style="flex:1;background:none;border:0;display:flex;align-items:center;justify-content:center;color:{{t.label3}}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M9 5l7 7-7 7"></path></svg></button></div>
<button aria-label="Kyoto, path NAS Home › Photos › 2026 › Kyoto" style="position:absolute;left:120px;top:62px;width:162px;height:44px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:{{t.label}}"><span style="display:flex;align-items:center;gap:4px;font-size:17px;font-weight:600;line-height:22px;white-space:nowrap">Kyoto<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="display:block;color:{{t.label2}}"><path d="M6 9l6 6 6-6"></path></svg></span><span style="font-size:12px;line-height:16px;color:{{t.label2}};white-space:nowrap;font-variant-numeric:tabular-nums">NAS Home · indexed 5 min ago</span></button>
<button aria-label="More selection actions" style="position:absolute;left:290px;top:62px;width:44px;height:44px;border-radius:22px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="18" height="18" viewBox="0 0 24 24" style="display:block"><circle cx="5" cy="12" r="1.6" fill="currentColor"></circle><circle cx="12" cy="12" r="1.6" fill="currentColor"></circle><circle cx="19" cy="12" r="1.6" fill="currentColor"></circle></svg></button>
<button aria-label="Done selecting" style="position:absolute;left:342px;top:62px;width:44px;height:44px;border-radius:22px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div role="menu" aria-label="Selection actions" style="position:absolute;right:16px;top:114px;width:262px;overflow:hidden;border-radius:24px;background:{{t.menu}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);padding:6px 0;box-sizing:border-box">
<sc-for list="{{menu}}" as="m" hint-placeholder-count="10"><sc-if value="{{m.sep}}" hint-placeholder-val="{{false}}"><div style="height:8px;background:{{t.fill}};opacity:0.7;margin:4px 0"></div></sc-if><sc-if value="{{m.item}}" hint-placeholder-val="{{true}}"><button role="menuitem" aria-disabled="{{m.dis}}" style="width:100%;height:44px;display:flex;align-items:center;gap:14px;padding:0 18px;box-sizing:border-box;background:none;border:none;color:{{m.fg}};font-size:17px;text-align:left;white-space:nowrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="{{m.d}}"></path></svg><span>{{m.l}}</span></button></sc-if></sc-for>
</div>
<button aria-label="Share" style="position:absolute;left:16px;top:782px;width:48px;height:48px;border-radius:24px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M12 3v12M8 7l4-4 4 4"></path><path d="M7 10H6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-1"></path></svg></button>
<div style="position:absolute;left:72px;width:258px;top:782px;height:48px;display:flex;justify-content:center"><button style="height:48px;padding:0 18px;border-radius:24px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);font-size:15px;font-weight:500;color:{{t.label}};white-space:nowrap;font-variant-numeric:tabular-nums">Show Selected (2・51.6MB)</button></div>
<button aria-label="Hide" style="position:absolute;left:338px;top:782px;width:48px;height:48px;border-radius:24px;background:{{t.glass}};border:1px solid {{t.glassStroke}};box-shadow:{{t.glassShadow}};backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);display:flex;align-items:center;justify-content:center;color:{{t.label}}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"></path><circle cx="12" cy="12" r="2.8"></circle><path d="M4 20L20 4"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
// iPhone · NAS Home source, folder Kyoto, selecting. Tokens + cell: PH_LibrarySelect.dc.html verbatim (same grid cell as
// All Photos — the server folder shows library photos, FS-19.03 §4). Menu rows: '-' separator or [label, glyph, flags]
// flags: d disabled. Rename… is single-photo only, so it is dimmed (not hidden) with two selected (DESIGN.md).
const LIGHT = { bg:'#FFFFFF', grouped:'#F2F2F7', card:'#FFFFFF', label:'#000000', label2:'#6C6C70', label3:'#8E8E93',
  sep:'#C6C6C8', fill:'#E9E9EB', fill2:'#F2F2F7', glass:'rgba(255,255,255,0.78)', glassStroke:'rgba(0,0,0,0.08)',
  glassShadow:'0 4px 18px rgba(0,0,0,0.12)', tint:'#C6730E', red:'#FF3B30', green:'#34C759', orange:'#FF9500',
  accent:'#C6730E', dim:'rgba(0,0,0,0.35)', sheet:'#FFFFFF', onAccent:'#FFFFFF' };
const DARK = { bg:'#000000', grouped:'#000000', card:'#1C1C1E', label:'#FFFFFF', label2:'#98989F', label3:'#6C6C70',
  sep:'#38383A', fill:'#2C2C2E', fill2:'#1C1C1E', glass:'rgba(44,44,46,0.78)', glassStroke:'rgba(255,255,255,0.10)',
  glassShadow:'0 4px 18px rgba(0,0,0,0.5)', tint:'#EB9526', red:'#FF453A', green:'#30D158', orange:'#FF9F0A',
  accent:'#EB9526', dim:'rgba(0,0,0,0.55)', sheet:'#1C1C1E', onAccent:'#000000' };
const SKIES=[['#5B7FA6','#E8C39E'],['#2E4A6B','#9FB8C9'],['#7A5C8E','#F2A774'],['#3D6B5A','#C9D6A3'],['#8AA9C1','#F4E1C1'],
 ['#1F3A4D','#D98C5F'],['#4F6D7A','#DDE2C6'],['#6B4E3D','#E2B07A'],['#355C7D','#C06C84'],['#2B5876','#4E4376'],['#A3B18A','#344E41'],['#D4A373','#606C38']];
const tile=(i)=>{const s=SKIES[i%SKIES.length];return 'linear-gradient(180deg,'+s[0]+' 0%,'+s[1]+' 58%,#2F3B2F 58%,#1E271E 100%)';};
const META=['ISO 400 · 85mm · f/1.8','ISO 100 · 24mm · f/8','ISO 3200 · 35mm · f/1.4','ISO 200 · 70mm · f/2.8',
 'ISO 800 · 50mm · f/2','ISO 125 · 16mm · f/11','ISO 640 · 135mm · f/1.8','ISO 1600 · 23mm · f/2','ISO 250 · 56mm · f/1.2'];
const FT=['RAW+JPG','RAW','RAW+JPG','JPG','RAW','HEIC','RAW+JPG','RAW','JPG'];
const STARS=[0,4,0,0,3,0,5,0,0,2,0,0,4,0,0,0,1,0];
const MENU=[
  ['Save to Photos','M12 3.5v11M8 10.5l4 4 4-4 M5 13.5v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5'],
  ['Export…','M13 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h7 M13 3.5l4 4V11 M18 21v-7M15 17l3-3 3 3'],
  ['Upload to Server…','M4 4h16v7H4z M4 13h16v7H4z M7.5 7.5h.01M7.5 16.5h.01M11 7.5h6M11 16.5h6'],
  ['Add to Collection','M3.5 8h13v11h-13z M6 5h9 M19.5 3.5v6M16.5 6.5h6'],
  ['Print…','M7 9V3.5h10V9 M7 17.5H4.5v-7A1.5 1.5 0 0 1 6 9h12a1.5 1.5 0 0 1 1.5 1.5v7H17 M7 14h10v6.5H7z'],
  '-',
  ['Compare','M3.5 5h7.5v14H3.5z M13 5h7.5v14H13z'],
  ['Rename…','M4 20h4L19 9l-4-4L4 16z M13.5 6.5l4 4','d'],
  ['Select All','M12 3.5a8.5 8.5 0 1 0 0.01 0z M8 12.3l2.7 2.7L16 9.6']
];
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const t = dark ? DARK : LIGHT;
    const sel = [4, 8];
    const tiles = [{ folder:true, photo:false, name:'Selects', cellBg:t.fill2 }];
    for (let i = 0; i < 17; i++) { const s = sel.indexOf(i + 1) >= 0;
      tiles.push({ folder:false, photo:true, cellBg:t.fill2, bg:tile(i * 5 + 4), op:s ? 0.82 : 1, ft:FT[i % FT.length], meta:META[i % META.length],
        rated:STARS[i] > 0, stars:String(STARS[i]), sel:s, unsel:!s }); }
    const menu = MENU.map(x => x === '-' ? { sep:true, item:false } :
      { sep:false, item:true, l:x[0], d:x[1], dis:x[2] === 'd' ? 'true' : 'false', fg:x[2] === 'd' ? t.label3 : t.label });
    return { t: Object.assign({}, t, { menu: dark ? 'rgba(44,44,46,0.94)' : 'rgba(250,250,252,0.94)' }), tiles, menu, edgeTop: dark ? 'rgba(0,0,0,0.72)' : 'rgba(255,255,255,0.72)', edgeClear: dark ? 'rgba(0,0,0,0)' : 'rgba(255,255,255,0)' };
  }
}
</script>
</body>
</html>
