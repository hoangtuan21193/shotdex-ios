<!-- UTILITIES TAB (2026-10-20, intent keep-offline; redrawn 2026-10-23): the tools, in a tab of their own right of
     Collections. Grouped by what the tool is for — Statistics card first (2026-10-24: Photos · Cameras · Lenses and photos per
     month for the last 12 months labelled only on the first, middle and last month (Nov · May · Oct; three letters — a name under every bar crowded the card, single letters read as a code; user 24/10), busiest month full accent, the rest accent at ~40%; the whole card opens the Statistics
     dashboard, where charts are listed and added). Then Library (Backup, On This iPhone, Duplicates, Hidden while anything is
     hidden, and the system utility albums such as Recently Deleted), Create (Collages, Video Projects, then the
     Combine Photos tools in the selection menu's order — Focus Stack, Panorama, HDR, Stack Exposures: tap opens the photo
     picker, 2+ photos open the tool, Save opens the new photo in Library; added 2026-10-24), Elsewhere. 2026-10-23: the
     two-wide grid of grey pills read as a wall of identical buttons (user: "xấu quá"), so each group is now one
     inset-grouped card of rows on the grouped background (DESIGN §10.1): glyph 20 in a 28 column, title 17, trailing count
     for the tools that have something waiting (Duplicates groups, Hidden photos, utility albums), chevron; hairline
     inset to the title; small uppercase header above each card. The list scrolls under the floating tab bar. The Explore
     group is gone (2026-10-24): Statistics became the card above, Places and Trips left the app.
     Long-press Duplicates / Places / Trips still pins them to the top of Collections. -->
