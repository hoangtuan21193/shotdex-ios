<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230"><rect width="800" height="230" fill="#F5F5F7"/><text x="20" y="30" font-family="-apple-system,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start">Tải phim Plex về máy</text><rect x="20" y="45" width="370" height="170" rx="10" fill="#fff" stroke="#D1D1D6"/><text x="40" y="80" font-family="-apple-system,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start">A. Bản gốc</text><text x="40" y="105" font-family="-apple-system,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#6C6C70" text-anchor="start">Dune.2024.2160p.mkv · 18.4 GB</text><text x="40" y="130" font-family="-apple-system,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#6C6C70" text-anchor="start">giống hệt file trên máy chủ</text><text x="40" y="155" font-family="-apple-system,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#1F7A35" text-anchor="start">nhanh nhất, nét nhất</text><rect x="410" y="45" width="370" height="170" rx="10" fill="#fff" stroke="#D1D1D6"/><text x="430" y="80" font-family="-apple-system,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start">B. Chọn chất lượng</text><text x="430" y="105" font-family="-apple-system,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#6C6C70" text-anchor="start">Original 18.4 GB · 1080p 6 GB · 720p 3 GB</text><text x="430" y="130" font-family="-apple-system,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#6C6C70" text-anchor="start">Plex nén lại trước khi gửi</text><text x="430" y="155" font-family="-apple-system,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#C4001A" text-anchor="start">cần Plex Pass, máy chủ phải chạy lâu</text></svg>