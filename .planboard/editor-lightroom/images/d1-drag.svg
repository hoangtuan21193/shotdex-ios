<svg xmlns="http://www.w3.org/2000/svg" width="540" height="420" font-family="-apple-system,Helvetica" font-size="15"><g transform="translate(10,0)"><text x="120" y="20" text-anchor="middle" font-weight="600">A. Kéo: bản nháp nhanh</text><rect x="0" y="30" width="240" height="380" rx="24" fill="#111" stroke="#888"/><rect x="10" y="70" width="220" height="150" fill="#4a6b8a"/><polygon points="10,220 80,130 140,170 230,110 230,220" fill="#3d5a3a"/><rect x="10" y="70" width="220" height="150" fill="#fff" opacity="0.18"/><text x="18" y="265" fill="#ddd" font-size="13">Exposure</text><line x1="90" y1="260" x2="220" y2="260" stroke="#555" stroke-width="3"/><circle cx="181.0" cy="260" r="8" fill="#fff"/><text x="18" y="300" fill="#bbb" font-size="13">đang kéo: ảnh nháp, theo tay</text><text x="18" y="322" fill="#bbb" font-size="13">thả tay: ảnh nét đủ</text><path d="M160 270 l20 0" stroke="#EB9526" stroke-width="3"/></g><g transform="translate(285,0)"><text x="120" y="20" text-anchor="middle" font-weight="600">B. Như cũ: nét đủ mỗi nhịp</text><rect x="0" y="30" width="240" height="380" rx="24" fill="#111" stroke="#888"/><rect x="10" y="70" width="220" height="150" fill="#4a6b8a"/><polygon points="10,220 80,130 140,170 230,110 230,220" fill="#3d5a3a"/><text x="18" y="265" fill="#ddd" font-size="13">Exposure</text><line x1="90" y1="260" x2="220" y2="260" stroke="#555" stroke-width="3"/><circle cx="181.0" cy="260" r="8" fill="#fff"/><text x="18" y="300" fill="#bbb" font-size="13">ảnh nét nhưng trễ tay</text><text x="18" y="322" fill="#bbb" font-size="13">khi bật khử nhiễu/làm nét</text></g></svg>