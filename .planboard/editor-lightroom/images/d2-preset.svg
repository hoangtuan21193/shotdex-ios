<svg xmlns="http://www.w3.org/2000/svg" width="540" height="420" font-family="-apple-system,Helvetica" font-size="15"><g transform="translate(10,0)"><text x="120" y="20" text-anchor="middle" font-weight="600">A. Giữ để xem thử</text><rect x="0" y="30" width="240" height="380" rx="24" fill="#111" stroke="#888"/><rect x="10" y="70" width="220" height="150" fill="#4a6b8a"/><polygon points="10,220 80,130 140,170 230,110 230,220" fill="#3d5a3a"/><rect x="10" y="70" width="220" height="150" fill="#c86" opacity="0.35"/><rect x="14" y="300" width="50" height="50" rx="6" fill="#8a6"/><rect x="70" y="300" width="50" height="50" rx="6" fill="#c86"/><rect x="126" y="300" width="50" height="50" rx="6" fill="#68a"/><rect x="182" y="300" width="50" height="50" rx="6" fill="#a6a"/><circle cx="95" cy="325" r="14" fill="none" stroke="#fff" stroke-width="2"/><text x="18" y="250" fill="#bbb" font-size="13">giữ ô: ảnh đổi theo look</text><text x="18" y="272" fill="#bbb" font-size="13">thả ra ngoài = huỷ, chạm = áp</text></g><g transform="translate(285,0)"><text x="120" y="20" text-anchor="middle" font-weight="600">B. Như cũ: chạm là áp</text><rect x="0" y="30" width="240" height="380" rx="24" fill="#111" stroke="#888"/><rect x="10" y="70" width="220" height="150" fill="#4a6b8a"/><polygon points="10,220 80,130 140,170 230,110 230,220" fill="#3d5a3a"/><rect x="14" y="300" width="50" height="50" rx="6" fill="#8a6"/><rect x="70" y="300" width="50" height="50" rx="6" fill="#c86"/><rect x="126" y="300" width="50" height="50" rx="6" fill="#68a"/><rect x="182" y="300" width="50" height="50" rx="6" fill="#a6a"/><text x="18" y="250" fill="#bbb" font-size="13">muốn xem phải áp rồi Undo</text></g></svg>