<svg xmlns="http://www.w3.org/2000/svg" width="540" height="420" font-family="-apple-system,Helvetica" font-size="15"><g transform="translate(10,0)"><text x="120" y="20" text-anchor="middle" font-weight="600">A. Nút so sánh chia đôi</text><rect x="0" y="30" width="240" height="380" rx="24" fill="#111" stroke="#888"/><rect x="10" y="70" width="220" height="150" fill="#4a6b8a"/><polygon points="10,220 80,130 140,170 230,110 230,220" fill="#3d5a3a"/><rect x="10" y="70" width="110" height="150" fill="#6b6b6b"/><line x1="120" y1="70" x2="120" y2="220" stroke="#fff" stroke-width="3"/><circle cx="120" cy="145" r="12" fill="#fff"/><text x="18" y="250" fill="#bbb" font-size="13">nút ◧ trên thanh lệnh</text><text x="18" y="272" fill="#bbb" font-size="13">kéo vạch giữa; giữ ảnh vẫn như cũ</text></g><g transform="translate(285,0)"><text x="120" y="20" text-anchor="middle" font-weight="600">B. Chỉ giữ để so</text><rect x="0" y="30" width="240" height="380" rx="24" fill="#111" stroke="#888"/><rect x="10" y="70" width="220" height="150" fill="#4a6b8a"/><polygon points="10,220 80,130 140,170 230,110 230,220" fill="#3d5a3a"/><text x="18" y="250" fill="#bbb" font-size="13">giữ ngón trên ảnh = bản gốc</text></g></svg>