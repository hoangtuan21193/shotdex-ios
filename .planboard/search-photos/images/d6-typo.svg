<svg xmlns="http://www.w3.org/2000/svg" width="820" height="510" font-family="-apple-system,Helvetica" font-size="14"><g transform="translate(10,0)"><rect x="0" y="30" width="250" height="470" rx="28" fill="#fff" stroke="#999" stroke-width="2"/><text x="125" y="20" font-size="16" text-anchor="middle" font-weight="600">A. Hỏi lại khi không có kết quả</text><rect x="12" y="60" width="226" height="34" rx="17" fill="#eee"/><text x="30" y="82">fujiflim</text><text x="16" y="130" font-weight="600">Không có gì khớp “fujiflim”</text><text x="16" y="160" fill="#c7740f">Có phải: Fujifilm (3.120 ảnh)?</text></g><g transform="translate(285,0)"><rect x="0" y="30" width="250" height="470" rx="28" fill="#fff" stroke="#999" stroke-width="2"/><text x="125" y="20" font-size="16" text-anchor="middle" font-weight="600">B. Không đoán</text><rect x="12" y="60" width="226" height="34" rx="17" fill="#eee"/><text x="30" y="82">fujiflim</text><text x="16" y="130" font-weight="600">Không có ảnh nào khớp.</text></g><g transform="translate(560,0)"><rect x="0" y="30" width="250" height="470" rx="28" fill="#fff" stroke="#999" stroke-width="2"/><text x="125" y="20" font-size="16" text-anchor="middle" font-weight="600">C. Tự sửa khi gõ</text><rect x="12" y="60" width="226" height="34" rx="17" fill="#eee"/><text x="30" y="82">fuji</text><rect x="16" y="110" width="34" height="34" rx="6" fill="#8a9"/><text x="58" y="125" font-weight="600">Fujifilm X-T5</text><text x="58" y="141" fill="#888" font-size="12">tự sửa luôn khi gõ</text><text x="232" y="132" text-anchor="end" fill="#888">3120</text></g></svg>