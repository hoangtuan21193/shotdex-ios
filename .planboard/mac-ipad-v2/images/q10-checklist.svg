<text x="400" y="34" font-size="20" text-anchor="middle" fill="#222" font-weight="700">Danh sách kiểm tay (Claude viết, bạn làm theo)</text><rect x="50" y="56" width="700" height="290" rx="12" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="1.5"/><rect x="80" y="82" width="22" height="22" rx="4" fill="#fff" stroke="#888" stroke-width="1.5"/><text x="116" y="100" font-size="16" text-anchor="start" fill="#222">Mac macOS 15: app chạy, giao diện cũ vẫn đủ nút</text><rect x="80" y="127" width="22" height="22" rx="4" fill="#fff" stroke="#888" stroke-width="1.5"/><text x="116" y="145" font-size="16" text-anchor="start" fill="#222">Sửa ảnh trên Mac → iPhone thấy bản sửa qua iCloud</text><rect x="80" y="172" width="22" height="22" rx="4" fill="#fff" stroke="#888" stroke-width="1.5"/><text x="116" y="190" font-size="16" text-anchor="start" fill="#222">Thoát, mở lại: thư mục nguồn đọc được, không hỏi lại</text><rect x="80" y="217" width="22" height="22" rx="4" fill="#fff" stroke="#888" stroke-width="1.5"/><text x="116" y="235" font-size="16" text-anchor="start" fill="#222">Tắt quyền Photos: app báo rõ, không thoát</text><rect x="80" y="262" width="22" height="22" rx="4" fill="#fff" stroke="#888" stroke-width="1.5"/><text x="116" y="280" font-size="16" text-anchor="start" fill="#222">Ảnh RAW trên ổ T7 sửa ở Mac → cắm vào iPhone vẫn thấy</text><text x="400" y="330" font-size="15" text-anchor="middle" fill="#555">Mỗi dòng có các bước bấm cụ thể; bạn ghi Đạt / Không đạt.</text>
