<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="800" height="380" fill="#FAF9F6"/>
<text x="400" y="32" font-size="20" text-anchor="middle" fill="#222" font-weight="700">Nhập xong thẻ nhớ trên iPhone / iPad</text><text x="200" y="72" font-size="16" text-anchor="middle" fill="#222" font-weight="700">Khi iPhone/iPad nhả được thẻ</text><rect x="30" y="90" width="340" height="120" rx="12" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="1.5"/><text x="50" y="130" font-size="16" text-anchor="start" fill="#222">Eject EOS_DIGITAL After Import</text><rect x="300" y="113" width="52" height="30" rx="15" fill="#34C759"/><circle cx="337" cy="128" r="12" fill="#fff"/><text x="50" y="180" font-size="15" text-anchor="start" fill="#555">→ nhập xong, thẻ tự nhả</text><text x="600" y="72" font-size="16" text-anchor="middle" fill="#222" font-weight="700">Khi không nhả được (thường gặp)</text><rect x="430" y="90" width="340" height="120" rx="12" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="1.5"/><text x="450" y="130" font-size="15" text-anchor="start" fill="#999">(không có công tắc Eject)</text><rect x="430" y="240" width="340" height="110" rx="12" fill="#E8F3E6" stroke="#5E9B57" stroke-width="1.5"/><text x="600" y="279" font-size="16" text-anchor="middle" fill="#222" font-weight="700">Imported 811 photos.</text><text x="600" y="300.6" font-size="16" text-anchor="middle" fill="#222">You can remove</text><text x="600" y="322.2" font-size="16" text-anchor="middle" fill="#222">EOS_DIGITAL now.</text><line x1="600" y1="210" x2="600" y2="236" stroke="#555" stroke-width="2" marker-end="url(#ar)"/><rect x="30" y="240" width="340" height="110" rx="12" fill="#F2F1ED" stroke="#D8D5CC" stroke-width="1.5"/><text x="200" y="279" font-size="16" text-anchor="middle" fill="#222">Không hứa điều máy không làm được:</text><text x="200" y="300.6" font-size="16" text-anchor="middle" fill="#222">công tắc chỉ hiện khi nhả thẻ</text><text x="200" y="322.2" font-size="16" text-anchor="middle" fill="#222">thật sự chạy.</text>
</svg>
