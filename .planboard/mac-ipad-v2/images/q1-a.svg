<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="800" height="360" fill="#FAF9F6"/>
<text x="400" y="34" font-size="19" text-anchor="middle" fill="#222" font-weight="700">Mặc định: ẩn ở cả hai nơi, Photos tự lo bản của nó</text><rect x="300" y="56" width="200" height="50" rx="12" fill="#FFF4E3" stroke="#C8761A" stroke-width="1.5"/><text x="400" y="86.6" font-size="16" text-anchor="middle" fill="#222" font-weight="700">Bấm Hide</text><line x1="340" y1="106" x2="190" y2="150" stroke="#555" stroke-width="2" marker-end="url(#ar)"/><line x1="460" y1="106" x2="610" y2="150" stroke="#555" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="155" width="300" height="80" rx="12" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="1.5"/><text x="190" y="179" font-size="16" text-anchor="middle" fill="#222" font-weight="700">Bản Photos</text><text x="190" y="200.6" font-size="16" text-anchor="middle" fill="#222">vào album Hidden của Photos</text><text x="190" y="222.2" font-size="16" text-anchor="middle" fill="#222">(iPhone, iPad, Mac đều ẩn)</text><rect x="460" y="155" width="300" height="80" rx="12" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="1.5"/><text x="610" y="179" font-size="16" text-anchor="middle" fill="#222" font-weight="700">Bản NAS</text><text x="610" y="200.6" font-size="16" text-anchor="middle" fill="#222">ShotDex đánh dấu ẩn</text><text x="610" y="222.2" font-size="16" text-anchor="middle" fill="#222">(file trên NAS không bị đụng)</text><rect x="120" y="265" width="560" height="70" rx="12" fill="#E8F3E6" stroke="#5E9B57" stroke-width="1.5"/><text x="400" y="294.8" font-size="16" text-anchor="middle" fill="#222">Ảnh biến khỏi lưới ShotDex và khỏi app Photos.</text><text x="400" y="316.40000000000003" font-size="16" text-anchor="middle" fill="#222">Xem lại: Collections → Hidden. Bỏ ẩn cũng một lần bấm.</text>
</svg>
