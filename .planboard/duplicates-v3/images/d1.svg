<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="-apple-system,Helvetica,Arial" font-size="15"><rect width="800" height="340" fill="#f6f5f2"/><text x="20" y="32" font-size="17" fill="#555" font-weight="bold" text-anchor="start">Hôm nay: chọn theo file</text><text x="420" y="32" font-size="17" fill="#1f7a4d" font-weight="bold" text-anchor="start">Đề xuất: chọn theo chất lượng ảnh</text><rect x="20" y="50" width="170" height="170" rx="8" fill="#b9c4cc" stroke="none" stroke-width="0"/><rect x="200" y="50" width="80" height="80" rx="8" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="290" y="50" width="80" height="80" rx="8" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="200" y="140" width="80" height="80" rx="8" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="290" y="140" width="80" height="80" rx="8" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="28" y="188" width="88" height="24" rx="12" fill="#777" stroke="none" stroke-width="0"/><text x="72.0" y="205" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">Lớn nhất</text><rect x="420" y="50" width="170" height="170" rx="8" fill="#b9c4cc" stroke="none" stroke-width="0"/><rect x="600" y="50" width="80" height="80" rx="8" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="690" y="50" width="80" height="80" rx="8" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="600" y="140" width="80" height="80" rx="8" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="690" y="140" width="80" height="80" rx="8" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="428" y="188" width="88" height="24" rx="12" fill="#1f7a4d" stroke="none" stroke-width="0"/><text x="472.0" y="205" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">Nét nhất</text><rect x="522" y="188" width="70" height="24" rx="12" fill="#1f7a4d" stroke="none" stroke-width="0"/><text x="557.0" y="205" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">Mắt mở</text><text x="200" y="250" font-size="13" fill="#555" font-weight="normal" text-anchor="start">2.1 MB</text><text x="290" y="250" font-size="13" fill="#555" font-weight="normal" text-anchor="start">2.0 MB</text><text x="600" y="250" font-size="13" fill="#c8372d" font-weight="600" text-anchor="start">Mắt nhắm</text><text x="690" y="250" font-size="13" fill="#c8372d" font-weight="600" text-anchor="start">Hơi mờ</text><text x="20" y="290" font-size="15" fill="#555" font-weight="normal" text-anchor="start">Ảnh giữ lại = file lớn nhất. Không nói ảnh nào nét.</text><text x="420" y="290" font-size="15" fill="#333" font-weight="normal" text-anchor="start">Ảnh giữ lại kèm lý do; mỗi bản còn lại ghi điểm yếu.</text><text x="420" y="315" font-size="15" fill="#333" font-weight="normal" text-anchor="start">Đo trên máy, chỉ trên ảnh đã vào nhóm.</text></svg>