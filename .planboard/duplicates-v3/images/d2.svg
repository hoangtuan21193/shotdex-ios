<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" font-family="-apple-system,Helvetica,Arial" font-size="15"><rect width="800" height="370" fill="#f6f5f2"/><text x="20" y="32" font-size="17" fill="#333" font-weight="bold" text-anchor="start">Màn đầu tiên khi mở Duplicates</text><rect x="20" y="50" width="360" height="300" rx="16" fill="#fff" stroke="none" stroke-width="0"/><text x="40" y="85" font-size="20" fill="#222" font-weight="bold" text-anchor="start">~4.2 GB có thể giải phóng</text><text x="40" y="110" font-size="14" fill="#666" font-weight="normal" text-anchor="start">312 nhóm · quét xong 2 phút trước</text><rect x="40" y="128" width="320" height="96" rx="12" fill="#e8f3ec" stroke="none" stroke-width="0"/><text x="56" y="156" font-size="16" fill="#1f7a4d" font-weight="bold" text-anchor="start">Dọn nhanh, an toàn</text><text x="56" y="180" font-size="14" fill="#333" font-weight="normal" text-anchor="start">212 bản sao giống hệt · 1.2 GB</text><rect x="56" y="190" width="200" height="28" rx="15" fill="#1f7a4d" stroke="none" stroke-width="0"/><text x="156.0" y="209.0" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Xem và dọn 212…</text><rect x="40" y="236" width="320" height="96" rx="12" fill="#fbf1e6" stroke="none" stroke-width="0"/><text x="56" y="264" font-size="16" fill="#d9822b" font-weight="bold" text-anchor="start">Cần bạn chọn</text><text x="56" y="288" font-size="14" fill="#333" font-weight="normal" text-anchor="start">100 nhóm gần giống · 3.0 GB</text><rect x="56" y="298" width="160" height="28" rx="15" fill="#d9822b" stroke="none" stroke-width="0"/><text x="136.0" y="317.0" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Bắt đầu chọn</text><text x="410" y="80" font-size="15" fill="#222" font-weight="normal" text-anchor="start">• Dọn nhanh: chỉ bản sao giống hệt và bản</text><text x="410" y="102" font-size="15" fill="#222" font-weight="normal" text-anchor="start">  nhỏ hơn (gửi qua Zalo, ảnh xuất cỡ nhỏ).</text><text x="410" y="130" font-size="15" fill="#222" font-weight="normal" text-anchor="start">• Bấm vào thì xem trước danh sách, rồi mới</text><text x="410" y="152" font-size="15" fill="#222" font-weight="normal" text-anchor="start">  đánh dấu. Chưa xoá gì cho tới nút Delete.</text><text x="410" y="180" font-size="15" fill="#222" font-weight="normal" text-anchor="start">• Ảnh yêu thích, đã sửa, trong album:</text><text x="410" y="202" font-size="15" fill="#222" font-weight="normal" text-anchor="start">  không bao giờ tự chọn xoá.</text><text x="410" y="230" font-size="15" fill="#222" font-weight="normal" text-anchor="start">• Nhóm gần giống: duyệt từng nhóm,</text><text x="410" y="252" font-size="15" fill="#222" font-weight="normal" text-anchor="start">  app chỉ gợi ý, bạn bấm.</text></svg>