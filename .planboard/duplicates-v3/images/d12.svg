<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" font-family="-apple-system,Helvetica,Arial" font-size="15"><rect width="800" height="180" fill="#f6f5f2"/><text x="20" y="32" font-size="17" fill="#333" font-weight="bold" text-anchor="start">Đang chọn dở thì iOS tắt app</text><rect x="20" y="50" width="220" height="110" rx="12" fill="#fff" stroke="none" stroke-width="0"/><text x="36" y="80" font-size="15" fill="#222" font-weight="normal" text-anchor="start">Chọn 140 ảnh trong</text><text x="36" y="102" font-size="15" fill="#222" font-weight="normal" text-anchor="start">40 nhóm, rồi trả lời</text><text x="36" y="124" font-size="15" fill="#222" font-weight="normal" text-anchor="start">tin nhắn khách…</text><text x="260" y="110" font-size="30" fill="#888" font-weight="normal" text-anchor="start">→</text><rect x="310" y="50" width="220" height="110" rx="12" fill="#fdecea" stroke="none" stroke-width="0"/><text x="326" y="80" font-size="15" fill="#c8372d" font-weight="bold" text-anchor="start">Hôm nay:</text><text x="326" y="102" font-size="15" fill="#222" font-weight="normal" text-anchor="start">mở lại app, mất hết</text><text x="326" y="124" font-size="15" fill="#222" font-weight="normal" text-anchor="start">lựa chọn.</text><rect x="560" y="50" width="220" height="110" rx="12" fill="#e8f3ec" stroke="none" stroke-width="0"/><text x="576" y="80" font-size="15" fill="#1f7a4d" font-weight="bold" text-anchor="start">Đề xuất:</text><text x="576" y="102" font-size="15" fill="#222" font-weight="normal" text-anchor="start">mọi lựa chọn và nhóm</text><text x="576" y="124" font-size="15" fill="#222" font-weight="normal" text-anchor="start">đã duyệt còn nguyên.</text></svg>