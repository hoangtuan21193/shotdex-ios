<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="-apple-system,Helvetica,Arial" font-size="15"><rect width="800" height="260" fill="#f6f5f2"/><text x="20" y="32" font-size="17" fill="#c8372d" font-weight="bold" text-anchor="start">Hôm nay: chạm ảnh = đánh dấu xoá</text><text x="420" y="32" font-size="17" fill="#1f7a4d" font-weight="bold" text-anchor="start">Đề xuất: chạm ảnh = mở to</text><rect x="20" y="50" width="160" height="160" rx="10" fill="#c9d1d7" stroke="#c8372d" stroke-width="4"/><circle cx="160" cy="70" r="13" fill="#c8372d"/><text x="160" y="75" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">✓</text><text x="20" y="240" font-size="15" fill="#555" font-weight="normal" text-anchor="start">Muốn xem kỹ thì lại bị đánh dấu.</text><rect x="420" y="50" width="160" height="160" rx="10" fill="#c9d1d7" stroke="none" stroke-width="0"/><circle cx="560" cy="70" r="16" fill="#fff" stroke="#888" stroke-width="2"/><text x="600" y="80" font-size="15" fill="#222" font-weight="normal" text-anchor="start">← vòng tròn 44pt ở góc:</text><text x="600" y="102" font-size="15" fill="#222" font-weight="normal" text-anchor="start">   chạm để đánh dấu</text><text x="600" y="140" font-size="15" fill="#222" font-weight="normal" text-anchor="start">Chạm giữa ảnh: mở to,</text><text x="600" y="162" font-size="15" fill="#222" font-weight="normal" text-anchor="start">vuốt qua lại trong nhóm,</text><text x="600" y="184" font-size="15" fill="#222" font-weight="normal" text-anchor="start">có nút Keep this.</text></svg>