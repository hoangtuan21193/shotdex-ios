<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="-apple-system,Helvetica,Arial" font-size="15"><rect width="800" height="380" fill="#f6f5f2"/><text x="20" y="32" font-size="17" fill="#333" font-weight="bold" text-anchor="start">Màn chọn khung cho cụm cùng khoảnh khắc (kể cả burst)</text><rect x="20" y="50" width="400" height="260" rx="10" fill="#aeb8c0" stroke="none" stroke-width="0"/><text x="220" y="185" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Khung đang xem</text><rect x="30" y="276" width="169" height="24" rx="12" fill="#1f7a4d" stroke="none" stroke-width="0"/><text x="114.5" y="293" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">Nét nhất · mắt mở</text><rect x="20" y="320" width="41" height="41" rx="6" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="65" y="320" width="41" height="41" rx="6" fill="#c9d1d7" stroke="none" stroke-width="0"/><circle cx="99" cy="327" r="4" fill="#c8372d"/><rect x="110" y="320" width="41" height="41" rx="6" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="155" y="320" width="41" height="41" rx="6" fill="#c9d1d7" stroke="#d9822b" stroke-width="3"/><rect x="200" y="320" width="41" height="41" rx="6" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="245" y="320" width="41" height="41" rx="6" fill="#c9d1d7" stroke="none" stroke-width="0"/><circle cx="279" cy="327" r="4" fill="#c8372d"/><rect x="290" y="320" width="41" height="41" rx="6" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="335" y="320" width="41" height="41" rx="6" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="380" y="320" width="41" height="41" rx="6" fill="#c9d1d7" stroke="none" stroke-width="0"/><text x="450" y="70" font-size="15" fill="#222" font-weight="normal" text-anchor="start">• Khung lớn chiếm chỗ đen thừa (+~100pt).</text><text x="450" y="98" font-size="15" fill="#222" font-weight="normal" text-anchor="start">• Pinch zoom giữ nguyên chỗ khi vuốt</text><text x="450" y="120" font-size="15" fill="#222" font-weight="normal" text-anchor="start">  sang khung khác (soi nét, soi mắt).</text><text x="450" y="148" font-size="15" fill="#222" font-weight="normal" text-anchor="start">• Nút “Zoom vào mặt”: nhảy tới khuôn mặt.</text><text x="450" y="176" font-size="15" fill="#222" font-weight="normal" text-anchor="start">• Dải phim có chấm đỏ = mắt nhắm / mờ.</text><text x="450" y="204" font-size="15" fill="#222" font-weight="normal" text-anchor="start">• Giữ / bỏ từng khung, rồi</text><text x="450" y="226" font-size="15" fill="#222" font-weight="normal" text-anchor="start">  “Keep picks, remove the rest”.</text><text x="450" y="254" font-size="15" fill="#222" font-weight="normal" text-anchor="start">• Nút đóng và nút hành động ở dưới,</text><text x="450" y="276" font-size="15" fill="#222" font-weight="normal" text-anchor="start">  vuốt xuống để đóng.</text></svg>