<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" font-family="-apple-system,Helvetica,Arial" font-size="15"><rect width="800" height="310" fill="#f6f5f2"/><text x="20" y="32" font-size="17" fill="#333" font-weight="bold" text-anchor="start">Nhóm 52 ảnh trên iPhone</text><text x="20" y="58" font-size="15" fill="#c8372d" font-weight="normal" text-anchor="start">Hôm nay: cả 52 ô (~2.5 màn hình), nút ở tận đáy</text><rect x="20" y="70" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="62" y="70" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="104" y="70" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="146" y="70" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="188" y="70" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="20" y="112" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="62" y="112" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="104" y="112" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="146" y="112" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="188" y="112" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="20" y="154" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="62" y="154" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="104" y="154" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="146" y="154" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="188" y="154" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/><rect x="20" y="196" width="38" height="38" rx="5" fill="#c9d1d7" stroke="none" stroke-width="0"/