<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="-apple-system,Helvetica,Arial" font-size="15"><rect width="800" height="330" fill="#f6f5f2"/><text x="20" y="32" font-size="17" fill="#333" font-weight="bold" text-anchor="start">Bộ 5 khung bracket ±2 EV</text><rect x="20" y="50" width="70" height="70" rx="8" fill="#3a3f44" stroke="none" stroke-width="0"/><text x="55" y="140" font-size="13" fill="#444" font-weight="600" text-anchor="middle">−2 EV</text><rect x="96" y="50" width="70" height="70" rx="8" fill="#6b737a" stroke="none" stroke-width="0"/><text x="131" y="140" font-size="13" fill="#444" font-weight="600" text-anchor="middle">−1 EV</text><rect x="172" y="50" width="70" height="70" rx="8" fill="#9aa4ac" stroke="none" stroke-width="0"/><text x="207" y="140" font-size="13" fill="#444" font-weight="600" text-anchor="middle">0 EV</text><rect x="248" y="50" width="70" height="70" rx="8" fill="#c7cfd5" stroke="none" stroke-width="0"/><text x="283" y="140" font-size="13" fill="#444" font-weight="600" text-anchor="middle">+1 EV</text><rect x="324" y="50" width="70" height="70" rx="8" fill="#eef1f3" stroke="none" stroke-width="0"/><text x="359" y="140" font-size="13" fill="#444" font-weight="600" text-anchor="middle">+2 EV</text><text x="420" y="70" font-size="15" fill="#c8372d" font-weight="bold" text-anchor="start">Hôm nay:</text><text x="420" y="94" font-size="15" fill="#222" font-weight="normal" text-anchor="start">nằm trong Exact/Similar, gợi ý giữ khung +2 EV</text><text x="420" y="116" font-size="15" fill="#222" font-weight="normal" text-anchor="start">(file lớn nhất, cháy sáng), nút đỏ xoá 4 khung.</text><rect x="20" y="170" width="760" height="110" rx="14" fill="#fff" stroke="none" stroke-width="0"/><text x="40" y="200" font-size="16" fill="#222" font-weight="bold" text-anchor="start">Bracket · 5 frames · ±2 EV</text><text x="40" y="224" font-size="14" fill="#555" font-weight="normal" text-anchor="start">Not duplicates: these are source frames for an HDR merge.</text><rect x="40" y="236" width="150" height="30" rx="15" fill="#d9822b" stroke="none" stroke-width="0"/><text x="115.0" y="256.0" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Merge to HDR</text><rect x="200" y="236" width="160" height="30" rx="15" fill="#eee" stroke="none" stroke-width="0"/><text x="280.0" y="256.0" font-size="14" fill="#222" font-weight="600" text-anchor="middle">Not duplicates</text><text x="400" y="255" font-size="14" fill="#555" font-weight="normal" text-anchor="start">Không có nút xoá đỏ, không tính vào “GB có thể giải phóng”.</text><text x="20" y="310" font-size="15" fill="#222" font-weight="normal" text-anchor="start">Tương tự: focus stack → Focus Stack, ảnh nối → Panorama; khác tiêu cự > 10% → không gộp.</text></svg>