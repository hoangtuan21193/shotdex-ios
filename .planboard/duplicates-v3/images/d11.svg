<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" font-family="-apple-system,Helvetica,Arial" font-size="15"><rect width="800" height="230" fill="#f6f5f2"/><text x="20" y="32" font-size="17" fill="#333" font-weight="bold" text-anchor="start">Trước khi xoá</text><text x="420" y="32" font-size="17" fill="#333" font-weight="bold" text-anchor="start">Sau khi xoá</text><rect x="20" y="50" width="360" height="70" rx="35" fill="#fff" stroke="none" stroke-width="0"/><text x="44" y="80" font-size="15" fill="#222" font-weight="600" text-anchor="start">37 selected · 210 MB  ›</text><text x="44" y="102" font-size="13" fill="#666" font-weight="normal" text-anchor="start">2 are in albums · kept photo joins them</text><rect x="280" y="70" width="84" height="30" rx="15" fill="#c8372d" stroke="none" stroke-width="0"/><text x="322.0" y="90.0" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Delete</text><text x="20" y="150" font-size="15" fill="#222" font-weight="normal" text-anchor="start">Chạm “37 selected ›” → danh sách ảnh sắp xoá,</text><text x="20" y="172" font-size="15" fill="#222" font-weight="normal" text-anchor="start">bỏ chọn từng ảnh được.</text><rect x="420" y="50" width="360" height="80" rx="14" fill="#2a2a2a" stroke="none" stroke-width="0"/><text x="440" y="80" font-size="15" fill="#fff" font-weight="600" text-anchor="start">37 photos moved to Recently Deleted</text><text x="440" y="104" font-size="13" fill="#ccc" font-weight="normal" text-anchor="start">210 MB freed · kept 30 days</text><text x="700" y="104" font-size="13" fill="#d9822b" font-weight="bold" text-anchor="start">Open Photos</text><text x="420" y="160" font-size="15" fill="#222" font-weight="normal" text-anchor="start">Không có Undo thật: iOS không cho app nào</text><text x="420" y="182" font-size="15" fill="#222" font-weight="normal" text-anchor="start">lấy lại ảnh từ Recently Deleted. Nói thẳng</text><text x="420" y="204" font-size="15" fill="#222" font-weight="normal" text-anchor="start">ảnh nằm đâu và nút mở Photos.</text></svg>