<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="-apple-system,Helvetica,Arial" font-size="15"><rect width="800" height="350" fill="#f6f5f2"/><text x="20" y="32" font-size="17" fill="#555" font-weight="bold" text-anchor="start">Hôm nay: 4 tab</text><rect x="20" y="48" width="90" height="30" rx="15" fill="#e4e4e4" stroke="none" stroke-width="0"/><text x="65.0" y="68.0" font-size="14" fill="#222" font-weight="600" text-anchor="middle">Exact</text><rect x="114" y="48" width="90" height="30" rx="15" fill="#e4e4e4" stroke="none" stroke-width="0"/><text x="159.0" y="68.0" font-size="14" fill="#222" font-weight="600" text-anchor="middle">Similar</text><rect x="208" y="48" width="90" height="30" rx="15" fill="#e4e4e4" stroke="none" stroke-width="0"/><text x="253.0" y="68.0" font-size="14" fill="#222" font-weight="600" text-anchor="middle">Series</text><rect x="302" y="48" width="90" height="30" rx="15" fill="#e4e4e4" stroke="none" stroke-width="0"/><text x="347.0" y="68.0" font-size="14" fill="#222" font-weight="600" text-anchor="middle">Bursts</text><text x="20" y="110" font-size="15" fill="#555" font-weight="normal" text-anchor="start">Similar và Series chứa cùng một cụm ảnh;</text><text x="20" y="132" font-size="15" fill="#555" font-weight="normal" text-anchor="start">Bursts chỉ có burst của iPhone.</text><text x="20" y="190" font-size="17" fill="#1f7a4d" font-weight="bold" text-anchor="start">Đề xuất: một danh sách, hàng lọc theo loại</text><rect x="20" y="206" width="80" height="30" rx="15" fill="#e8f3ec" stroke="none" stroke-width="0"/><text x="60.0" y="226.0" font-size="14" fill="#222" font-weight="600" text-anchor="middle">All 312</text><rect x="106" y="206" width="110" height="30" rx="15" fill="#eee" stroke="none" stroke-width="0"/><text x="161.0" y="226.0" font-size="14" fill="#222" font-weight="600" text-anchor="middle">Copies 212</text><rect x="222" y="206" width="160" height="30" rx="15" fill="#eee" stroke="none" stroke-width="0"/><text x="302.0" y="226.0" font-size="14" fill="#222" font-weight="600" text-anchor="middle">Smaller copies 40</text><rect x="388" y="206" width="140" height="30" rx="15" fill="#eee" stroke="none" stroke-width="0"/><text x="458.0" y="226.0" font-size="14" fill="#222" font-weight="600" text-anchor="middle">Look-alikes 48</text><rect x="534" y="206" width="150" height="30" rx="15" fill="#eee" stroke="none" stroke-width="0"/><text x="609.0" y="226.0" font-size="14" fill="#222" font-weight="600" text-anchor="middle">Same moment 12</text><text x="20" y="270" font-size="15" fill="#222" font-weight="normal" text-anchor="start">Mỗi cụm chỉ nằm ở một loại. Burst iPhone và cụm chụp liên tiếp của máy ảnh</text><text x="20" y="292" font-size="15" fill="#222" font-weight="normal" text-anchor="start">cùng vào “Same moment”, mở cùng một màn chọn khung.</text><text x="20" y="330" font-size="15" fill="#666" font-weight="normal" text-anchor="start">Chữ trên app vẫn tiếng Anh (Mỹ), đổi sang từ dễ hiểu.</text></svg>