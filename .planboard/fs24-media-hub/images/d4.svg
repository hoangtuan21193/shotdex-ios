<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="-apple-system,Helvetica,Arial" fill="#1C1C1E"><rect width="800" height="300" fill="#FFFFFF"/><rect x="20" y="40" width="360" height="220" rx="14" fill="#E8F4EA" stroke="#C6C6C8"/><text x="200.0" y="70" font-size="17" font-weight="700" text-anchor="middle">Nhạc FLAC, MP3, AAC, ALAC, WAV</text><text x="200.0" y="102" font-size="15" text-anchor="middle">phát được, có gapless</text><text x="200.0" y="128" font-size="15" text-anchor="middle">hiện ở thư viện</text><rect x="420" y="40" width="360" height="220" rx="14" fill="#FDF1E2" stroke="#C6C6C8"/><text x="600.0" y="70" font-size="17" font-weight="700" text-anchor="middle">OGG, Opus, APE</text><text x="600.0" y="102" font-size="15" text-anchor="middle">bỏ qua ở bản đầu</text><text x="600.0" y="128" font-size="15" text-anchor="middle">Settings ghi: &quot;23 files not supported&quot;</text></svg>