<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="-apple-system,Helvetica,Arial" fill="#1C1C1E"><rect width="800" height="300" fill="#FFFFFF"/><rect x="20" y="40" width="360" height="220" rx="14" fill="#FDF1E2" stroke="#C6C6C8"/><text x="200.0" y="70" font-size="17" font-weight="700" text-anchor="middle">Bản xem 2732 px (Claude chọn)</text><text x="200.0" y="102" font-size="15" text-anchor="middle">đủ nét để xem toàn màn hình</text><text x="200.0" y="128" font-size="15" text-anchor="middle">~1.2 MB / ảnh</text><text x="200.0" y="154" font-size="15" text-anchor="middle">1,000 ảnh ≈ 1.2 GB</text><rect x="420" y="40" width="360" height="220" rx="14" fill="#F2F2F7" stroke="#C6C6C8"/><text x="600.0" y="70" font-size="17" font-weight="700" text-anchor="middle">Bản gốc đầy đủ</text><text x="600.0" y="102" font-size="15" text-anchor="middle">sửa, xuất được offline</text><text x="600.0" y="128" font-size="15" text-anchor="middle">~5–40 MB / ảnh (RAW)</text><text x="600.0" y="154" font-size="15" text-anchor="middle">1,000 ảnh ≈ 20 GB</text></svg>